# Main entry point for the role.

---

- name: "Main | Include role initialization tasks"
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/init.yml"
    apply:
      tags:
        - "always"
        - "pve_proxmox_always"
  tags:
    - "always"
    - "pve_proxmox_always"


# Separate includes for platform-specific files and default.yml on purpose. When
# looping over "platform files + ['default.yml']" for multiple platforms in one
# play, Ansible batches them across all hosts. Insertion order depends on when
# results arrive (non-deterministic behavior) and default.yml may run before the
# platform-specific files. Separate tasks enforce the required barrier.

- name: "Main | Include operating system (OS) configuration: best platform matches (if any)"
  ansible.builtin.include_tasks:
    file: "{{ __pve_proxmox_task_file }}"
    apply:
      tags:
        - "pve_proxmox_os"
  vars:
    __pve_proxmox_task_file: "{{ role_path }}/tasks/os/{{ __pve_proxmox_loop_item }}"
  when:
    - pve_proxmox_state == 'present'
    - __pve_proxmox_task_file is ansible.builtin.file
  loop: "{{ __pve_proxmox_platform_filenames_most_specific_first }}"
  loop_control:
    loop_var: "__pve_proxmox_loop_item"
  tags:
    - "pve_proxmox_os"


- name: "Main | Include operating system (OS) configuration: default"
  ansible.builtin.include_tasks:
    file: "{{ __pve_proxmox_task_file }}"
    apply:
      tags:
        - "pve_proxmox_os"
  vars:
