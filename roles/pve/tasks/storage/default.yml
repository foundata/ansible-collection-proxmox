# Storage: Manage basic operating system storage configuration as well as the
# storage manager of Proxmox Virtual Environment (PVE)
#
# SPDX-FileCopyrightText: foundata GmbH <https://foundata.com>
# SPDX-License-Identifier: GPL-3.0-or-later

---
- name: "Storage | Reset invocation-local discovery state"
  ansible.builtin.set_fact:
    __pve_zpool_all_disks: {}
    __pve_disk_check_list: []
    __pve_pool_exists: {}
    __pve_storage_pool_data_status: {}
    __pve_zpool_status_devices: {}
    __pve_zpool_device_map: {}
    __pve_zpool_actual_devices: {}
    __pve_zpool_missing_devices: {}
    __pve_storage_wrong_pool_devices: {}
    __pve_zfs_dataset_exists: {}
    __pve_nfs_mount_status: {}
    __pve_storage_is_configured: {}

# All declared storage items are validated up front: the supported type set
# spans the ZFS and NFS sections (a mixed declaration is legitimate and used
# to be wrongly rejected by a type check inside the ZFS section), and the
# attributes each type dereferences unconditionally have to exist before any
# section starts changing state. The passphrase-presence check reads the
# UNSANITIZED item via the loop index on purpose; only the check itself does,
# nothing of it is printed.
- name: "Storage | Validate the declared storage items"
  ansible.builtin.assert:
    that:
      - __pve_proxmox_storage_item['type'] in ['zpool', 'zfs_dataset', 'nfs']
      - >-
        (__pve_proxmox_storage_item['type'] != 'zpool')
        or ((__pve_proxmox_storage_item['attributes']['vdevs'] | ansible.builtin.default([]) | ansible.builtin.length) > 0)
      - >-
        (__pve_proxmox_storage_item['type'] != 'nfs')
        or ((__pve_proxmox_storage_item['attributes']['storage_properties']['src'] is ansible.builtin.defined)
            and (__pve_proxmox_storage_item['attributes']['storage_properties']['path'] is ansible.builtin.defined))
      - >-
        (__pve_proxmox_storage_item['type'] != 'zfs_dataset')
        or (__pve_proxmox_storage_item['attributes']['zfs_properties']['encryption'] is not ansible.builtin.defined)
        or (__pve_proxmox_storage_item['attributes']['zfs_properties']['encryption'] == 'off')
        or ((__pve_proxmox_storage_item['attributes']['zfs_properties']['keylocation'] | ansible.builtin.default('prompt')) != 'prompt')
        or (pve_proxmox_storage[__pve_storage_validate_index]['attributes']['zfs_properties']['passphrase'] is ansible.builtin.defined)
      - >-
        (__pve_proxmox_storage_item['type'] != 'zfs_dataset')
        or ((__pve_proxmox_storage_item['attributes']['zfs_properties']['encryption'] | ansible.builtin.default('')) != 'off')
        or ((pve_proxmox_storage[__pve_storage_validate_index]['attributes']['zfs_properties']['keyformat'] is not ansible.builtin.defined)
            and (pve_proxmox_storage[__pve_storage_validate_index]['attributes']['zfs_properties']['keylocation'] is not ansible.builtin.defined)
            and (pve_proxmox_storage[__pve_storage_validate_index]['attributes']['zfs_properties']['pbkdf2iters'] is not ansible.builtin.defined)
            and (pve_proxmox_storage[__pve_storage_validate_index]['attributes']['zfs_properties']['passphrase'] is not ansible.builtin.defined)
            and (pve_proxmox_storage[__pve_storage_validate_index]['attributes']['zfs_properties']['passphrase_old'] is not ansible.builtin.defined))
    fail_msg: |
      Storage item '{{ __pve_proxmox_storage_item['name'] }}' is invalid. The type has to be one of
      'zpool', 'zfs_dataset' or 'nfs'; a 'zpool' item needs a non-empty
      'attributes.vdevs' list, an 'nfs' item needs 'storage_properties.src'
      and 'storage_properties.path', and an encrypted 'zfs_dataset' with
      keylocation 'prompt' needs a 'passphrase'. An explicit encryption 'off'
      declaration cannot include keyformat, keylocation, pbkdf2iters, passphrase or passphrase_old.
    quiet: true
  when:
    - pve_proxmox_storage is ansible.builtin.defined
    - pve_proxmox_storage | ansible.builtin.length > 0

  ### ZFS configuration
  loop: "{{ __pve_storage_sanitized }}"
  loop_control:
    loop_var: "__pve_proxmox_storage_item"
    index_var: "__pve_storage_validate_index"
- name: "Storage | Validate ZFS dataset selectors"
  ansible.builtin.assert:
    that:
      - __pve_zfs_selector_item['name'] is ansible.builtin.string
      - (__pve_zfs_selector_item['name'] | ansible.builtin.length) <= 255
      - __pve_zfs_selector_item['name'] is ansible.builtin.match(__pve_zfs_dataset_name_pattern)
      - "'.' not in __pve_zfs_selector_item['name'].split('/')"
      - "'..' not in __pve_zfs_selector_item['name'].split('/')"
      - __pve_zfs_selector_item['name'].split('/')[0] not in ['mirror', 'raidz', 'draid']
    fail_msg: "ZFS dataset selector must be an exact filesystem or volume name."
    quiet: true
  vars:
    __pve_zfs_dataset_name_pattern: "\\A[A-Za-z][A-Za-z0-9_.: -]*(/[A-Za-z0-9_.: %-]+)*\\Z"
  loop: >-
    {{
      __pve_storage_sanitized
      | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'zfs_dataset')
      | ansible.builtin.list
    }}
  loop_control:
    loop_var: "__pve_zfs_selector_item"
    label: "{{ __pve_zfs_selector_item['name'] }}"
- name: "Storage | ZFS"
  when:
    - pve_proxmox_storage is ansible.builtin.defined
    - >-
      pve_proxmox_storage
      | ansible.builtin.selectattr('type', 'ansible.builtin.in', ['zpool', 'zfs_dataset'])
      | ansible.builtin.list | ansible.builtin.length > 0
  block:
    - name: "Storage | ZFS | Ensure ZFS utilities are installed"
      ansible.builtin.package:
        name:
          - "zfsutils-linux"
        state: "present"

    - name: "Storage | ZFS | Gather existing ZFS pools"
      community.general.zpool_facts:
      register: __pve_zpool_facts


    # ZFS Pool Management
    - name: "Storage | ZFS | zpool | Extract all disks from vdevs"
      ansible.builtin.set_fact:
        __pve_zpool_all_disks: >-
          {{
            __pve_zpool_all_disks | ansible.builtin.default({}) | ansible.builtin.combine({
              __pve_proxmox_vdev_item['name']: __pve_proxmox_vdev_item['attributes']['vdevs']
                | ansible.builtin.map(attribute='disks')
                | ansible.builtin.flatten
                | ansible.builtin.list
            })
          }}
      when:
        - pve_proxmox_storage is ansible.builtin.defined
        - pve_proxmox_storage | ansible.builtin.length > 0

      loop: >-
        {{
          __pve_storage_sanitized
          | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'zpool')
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__pve_proxmox_vdev_item"
    - name: "Storage | ZFS | zpool | Validate disk count for vdev types"
      ansible.builtin.assert:
        that:
          - (vdev_item['type'] == 'stripe' and (vdev_item['disks'] | ansible.builtin.length) == 1) or (vdev_item['type'] == 'mirror' and (vdev_item['disks'] |
            ansible.builtin.length) >= 2) or (vdev_item['type'] == 'raidz1' and (vdev_item['disks'] | ansible.builtin.length) >= 2) or (vdev_item['type'] ==
            'raidz2' and (vdev_item['disks'] | ansible.builtin.length) >= 3) or (vdev_item['type'] == 'raidz3' and (vdev_item['disks'] | ansible.builtin.length)
            >= 4)
        fail_msg: |
          Invalid disk count for pool '{{ item['name'] }}' vdev type '{{ vdev_item['type'] }}':
          - 'stripe' requires exactly 1 disk
          - 'mirror' requires at least 2 disks
          - 'raidz1' requires at least 2 disks
          - 'raidz2' requires at least 3 disks
          - 'raidz3' requires at least 4 disks
          You specified {{ vdev_item['disks'] | ansible.builtin.length }} disk(s)
      # subelements on purpose: every vdev of a pool has to be validated, not
      # just the first one.
      vars:
        item: "{{ __pve_proxmox_zpool_item[0] }}"
        vdev_item: "{{ __pve_proxmox_zpool_item[1] }}"
      when:
        - pve_proxmox_storage is ansible.builtin.defined
        - pve_proxmox_storage | ansible.builtin.length > 0

      loop: >-
        {{
          __pve_storage_sanitized
          | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'zpool')
          | ansible.builtin.list
          | ansible.builtin.subelements('attributes.vdevs', skip_missing=true)
        }}
      loop_control:
        loop_var: "__pve_proxmox_zpool_item"
        label: "{{ __pve_proxmox_zpool_item[0]['name'] }}: {{ __pve_proxmox_zpool_item[1]['type'] }}"
    - name: "Storage |  ZFS | Pool | Build disk check list"
      ansible.builtin.set_fact:
        __pve_disk_check_list: >-
          {{
            __pve_disk_check_list | ansible.builtin.default([]) + [
              {
                'pool': __pve_proxmox_checklist_item[0]['key'],
                'disk': __pve_proxmox_checklist_item[1]
              }
            ]
          }}
      when:
        - __pve_zpool_all_disks is ansible.builtin.defined
        - __pve_zpool_all_disks | ansible.builtin.length > 0

      loop: "{{ __pve_zpool_all_disks | ansible.builtin.default({}) | ansible.builtin.dict2items | ansible.builtin.subelements('value') }}"
      loop_control:
        loop_var: "__pve_proxmox_checklist_item"
    - name: "Storage | ZFS | zpool | Check disk existence"
      ansible.builtin.stat:
        path: "{{ __pve_proxmox_disk_check_item['disk'] }}"
      when:
        - __pve_disk_check_list is ansible.builtin.defined
        - __pve_disk_check_list | ansible.builtin.length > 0

      loop: "{{ __pve_disk_check_list | ansible.builtin.default([]) }}"
      loop_control:
        loop_var: "__pve_proxmox_disk_check_item"
        label: "{{ __pve_proxmox_disk_check_item['pool'] }}: {{ __pve_proxmox_disk_check_item['disk'] }}"
      register: __pve_storage_device_check
    - name: "Storage | ZFS | zpool | Assert all disks exist"
      ansible.builtin.assert:
        that:
          - __pve_proxmox_disk_assert_item['stat']['exists']
        fail_msg: >-
          Disk {{ __pve_proxmox_disk_assert_item['__pve_proxmox_disk_check_item']['disk'] }} does not exist
          for pool '{{ __pve_proxmox_disk_assert_item['__pve_proxmox_disk_check_item']['pool'] }}'
      when:
        - __pve_storage_device_check is ansible.builtin.defined
        - __pve_storage_device_check['results'] is ansible.builtin.defined

      loop: "{{ __pve_storage_device_check['results'] | ansible.builtin.default([]) }}"
      loop_control:
        loop_var: "__pve_proxmox_disk_assert_item"
        label: >-
          {{ __pve_proxmox_disk_assert_item['__pve_proxmox_disk_check_item']['pool'] }}:
          {{ __pve_proxmox_disk_assert_item['__pve_proxmox_disk_check_item']['disk'] }}
    - name: "Storage | ZFS | zpool | Check for existing data on disks (blkid)"
      ansible.builtin.command:
        argv:
          - "blkid"
          - "{{ __pve_proxmox_blkid_item['disk'] }}"
      when:
        - __pve_disk_check_list is ansible.builtin.defined
        - __pve_disk_check_list | ansible.builtin.length > 0

      changed_when:
        - false
      failed_when:
        - false
      loop: "{{ __pve_disk_check_list | ansible.builtin.default([]) }}"
      loop_control:
        loop_var: "__pve_proxmox_blkid_item"
        label: "{{ __pve_proxmox_blkid_item['pool'] }}: {{ __pve_proxmox_blkid_item['disk'] }}"
      register: __pve_storage_blkid_check
    - name: "Storage | ZFS | zpool | Check for ZFS labels on disks"
      ansible.builtin.shell: |
        set -o pipefail
        zdb -l {{ __pve_proxmox_zfs_label_item['disk'] | ansible.builtin.quote }} 2>/dev/null | grep -q 'name:' || exit 1
      args:
        executable: "/bin/bash"
      when:
        - __pve_disk_check_list is ansible.builtin.defined
        - __pve_disk_check_list | ansible.builtin.length > 0

      changed_when:
        - false
      failed_when:
        - false
      loop: "{{ __pve_disk_check_list | ansible.builtin.default([]) }}"
      loop_control:
        loop_var: "__pve_proxmox_zfs_label_item"
        label: "{{ __pve_proxmox_zfs_label_item['pool'] }}: {{ __pve_proxmox_zfs_label_item['disk'] }}"
      register: __pve_storage_zfs_label_check
    - name: "Storage | ZFS | zpool | Build pool status dictionary"
      ansible.builtin.set_fact:
        __pve_pool_exists: >-
          {{
            __pve_pool_exists | ansible.builtin.default({}) | ansible.builtin.combine({
              __pve_proxmox_pool_status_item['name']: __pve_proxmox_pool_status_item['name'] in
                (__pve_zpool_facts['ansible_facts']['ansible_zfs_pools'] | ansible.builtin.default([])
                 | ansible.builtin.map(attribute='name') | ansible.builtin.list)
            })
          }}
      when:
        - pve_proxmox_storage is ansible.builtin.defined
        - pve_proxmox_storage | ansible.builtin.length > 0

      loop: >-
        {{
          __pve_storage_sanitized
          | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'zpool')
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__pve_proxmox_pool_status_item"
    - name: "Storage | ZFS | zpool | Analyze disk data status per pool"
      ansible.builtin.set_fact:
        __pve_storage_pool_data_status: >-
          {{
            __pve_storage_pool_data_status | ansible.builtin.default({}) | ansible.builtin.combine({
              __pve_proxmox_pool_analyze_item['name']: {
                'has_data': (
                  __pve_storage_blkid_check['results'] | ansible.builtin.default([])
                  | ansible.builtin.selectattr('__pve_proxmox_blkid_item.pool', 'ansible.builtin.equalto', __pve_proxmox_pool_analyze_item['name'])
                  | ansible.builtin.selectattr('rc', 'ansible.builtin.equalto', 0)
                  | ansible.builtin.list | ansible.builtin.length > 0
                ) or (
                  __pve_storage_zfs_label_check['results'] | ansible.builtin.default([])
                  | ansible.builtin.selectattr('__pve_proxmox_zfs_label_item.pool', 'ansible.builtin.equalto', __pve_proxmox_pool_analyze_item['name'])
                  | ansible.builtin.selectattr('rc', 'ansible.builtin.equalto', 0)
                  | ansible.builtin.list | ansible.builtin.length > 0
                ),
                'exists': __pve_pool_exists[__pve_proxmox_pool_analyze_item['name']]
              }
            })
          }}
      when:
        - pve_proxmox_storage is ansible.builtin.defined
        - pve_proxmox_storage | ansible.builtin.length > 0

      loop: >-
        {{
          __pve_storage_sanitized
          | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'zpool')
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__pve_proxmox_pool_analyze_item"
    - name: "Storage | ZFS | zpool | Get device details for existing pools (still needs zpool status)"
      ansible.builtin.command:
        argv:
          - "zpool"
          - "status"
          - "{{ __pve_proxmox_zpool_status_item['name'] }}"
          - "-P"
      when:
        - pve_proxmox_storage is ansible.builtin.defined
        - pve_proxmox_storage | ansible.builtin.length > 0
        - __pve_pool_exists[__pve_proxmox_zpool_status_item['name']] | ansible.builtin.default(false) | ansible.builtin.bool

      changed_when:
        - false
      failed_when:
        - false
      loop: >-
        {{
          __pve_storage_sanitized
          | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'zpool')
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__pve_proxmox_zpool_status_item"
      register: __pve_zpool_status_detail
    - name: "Storage | ZFS | zpool | Extract device paths from zpool status"
      ansible.builtin.set_fact:
        __pve_zpool_status_devices: >-
          {{
            __pve_zpool_status_devices | ansible.builtin.default({}) | ansible.builtin.combine({
              __pve_proxmox_zpool_devices_item['__pve_proxmox_zpool_status_item']['name']: __pve_proxmox_zpool_devices_item['stdout_lines']
                | ansible.builtin.select('ansible.builtin.match', '^\s+/dev/')
                | ansible.builtin.map('ansible.builtin.regex_replace', '^\s+(/dev/[^\s]+).*', '\1')
                | ansible.builtin.list
            })
          }}
      when:
        - __pve_zpool_status_detail is ansible.builtin.defined
        - __pve_zpool_status_detail['results'] is ansible.builtin.defined
        - not __pve_proxmox_zpool_devices_item['skipped'] | ansible.builtin.default(false)
        - __pve_proxmox_zpool_devices_item is ansible.builtin.success

      loop: "{{ __pve_zpool_status_detail['results'] | ansible.builtin.default([]) }}"
      loop_control:
        loop_var: "__pve_proxmox_zpool_devices_item"
    - name: "Storage | ZFS | zpool | Resolve zpool status device paths to base devices"
      # ansible.builtin.shell is used because we need to resolve symlinks and
      # strip partition suffixes in a reliable way across different device types
      ansible.builtin.shell: |
        set -o pipefail
        device={{ zpool_device | ansible.builtin.quote }}

        # If device is a by-id path, resolve it
        if [[ "${device}" == /dev/disk/by-id/* ]]; then
          device=$(readlink -f "${device}")
        fi

        # Strip partition suffix (e.g., /dev/sda1 -> /dev/sda, /dev/nvme0n1p1 -> /dev/nvme0n1)
        base_device=$(echo "${device}" | sed -E 's|^(/dev/[a-z]+)[0-9]+$|\1|; s|^(/dev/nvme[0-9]+n[0-9]+)p[0-9]+$|\1|')
        basename "${base_device}"
      args:
        executable: "/bin/bash"
      vars:
        pool_name: "{{ __pve_proxmox_zpool_devpath_item[0]['key'] }}"
        zpool_device: "{{ __pve_proxmox_zpool_devpath_item[1] }}"
      when:
        - __pve_zpool_status_devices is ansible.builtin.defined
        - __pve_zpool_status_devices | ansible.builtin.length > 0

      changed_when:
        - false
      loop: "{{ __pve_zpool_status_devices | ansible.builtin.default({}) | ansible.builtin.dict2items | ansible.builtin.subelements('value') }}"
      loop_control:
        loop_var: "__pve_proxmox_zpool_devpath_item"
        label: "{{ pool_name }}: {{ zpool_device }}"
      register: __pve_zpool_status_devices_resolved
    - name: "Storage | ZFS | zpool | Resolve by-id paths to actual disk paths"
      ansible.builtin.stat:
        path: "{{ __pve_proxmox_disk_resolve_item['disk'] }}"
      when:
        - __pve_disk_check_list is ansible.builtin.defined
        - __pve_disk_check_list | ansible.builtin.length > 0

      loop: "{{ __pve_disk_check_list | ansible.builtin.default([]) }}"
      loop_control:
        loop_var: "__pve_proxmox_disk_resolve_item"
        label: "{{ __pve_proxmox_disk_resolve_item['pool'] }}: {{ __pve_proxmox_disk_resolve_item['disk'] }}"
      register: __pve_zpool_device_resolution
    - name: "Storage | ZFS | zpool | Build disk mapping for each pool"
      ansible.builtin.set_fact:
        __pve_zpool_device_map: >-
          {{
            __pve_zpool_device_map | ansible.builtin.default({}) | ansible.builtin.combine({
              __pve_proxmox_diskmap_item['__pve_proxmox_disk_resolve_item']['pool']: (
                __pve_zpool_device_map[__pve_proxmox_diskmap_item['__pve_proxmox_disk_resolve_item']['pool']] | ansible.builtin.default([])
              ) + [
                {
                  'by_id': __pve_proxmox_diskmap_item['__pve_proxmox_disk_resolve_item']['disk'],
                  'exists': __pve_proxmox_diskmap_item['stat']['exists'],
                  'realpath': (__pve_proxmox_diskmap_item['stat']['lnk_source']
                    if (__pve_proxmox_diskmap_item['stat']['exists'] and __pve_proxmox_diskmap_item['stat']['islnk'] | ansible.builtin.default(false))
                    else __pve_proxmox_diskmap_item['__pve_proxmox_disk_resolve_item']['disk']),
                  'basename': (
                    (__pve_proxmox_diskmap_item['stat']['lnk_source']
                      if (__pve_proxmox_diskmap_item['stat']['exists'] and __pve_proxmox_diskmap_item['stat']['islnk'] | ansible.builtin.default(false))
                      else __pve_proxmox_diskmap_item['__pve_proxmox_disk_resolve_item']['disk'])
                    | ansible.builtin.basename
                  )
                }
              ]
            })
          }}
      when:
        - __pve_zpool_device_resolution is ansible.builtin.defined

      loop: "{{ __pve_zpool_device_resolution['results'] | ansible.builtin.default([]) }}"
      loop_control:
        loop_var: "__pve_proxmox_diskmap_item"
    - name: "Storage | ZFS | zpool | Build actual devices dictionary"
      ansible.builtin.set_fact:
        __pve_zpool_actual_devices: >-
          {{
            __pve_zpool_actual_devices | ansible.builtin.default({}) | ansible.builtin.combine({
              pool_name: {
                'devices_found': __pve_zpool_status_devices[pool_name],
                'pool_devices': __pve_zpool_status_devices_resolved['results']
                  | ansible.builtin.selectattr('__pve_proxmox_zpool_devpath_item.0.key', 'ansible.builtin.equalto', pool_name)
                  | ansible.builtin.map(attribute='stdout')
                  | ansible.builtin.map('ansible.builtin.trim')
                  | ansible.builtin.unique
                  | ansible.builtin.list,
                'expected_devices': __pve_zpool_device_map[pool_name]
                  | ansible.builtin.selectattr('exists', 'ansible.builtin.equalto', true)
                  | ansible.builtin.map(attribute='basename')
                  | ansible.builtin.list
              }
            })
          }}
      vars:
        pool_name: "{{ __pve_proxmox_actualdev_item['key'] }}"
      when:
        - __pve_zpool_status_devices is ansible.builtin.defined
        - __pve_zpool_status_devices_resolved is ansible.builtin.defined

      loop: "{{ __pve_zpool_status_devices | ansible.builtin.default({}) | ansible.builtin.dict2items }}"
      loop_control:
        loop_var: "__pve_proxmox_actualdev_item"
        label: "{{ pool_name }}"
    - name: "Storage | ZFS | zpool | Check for non-existent disks"
      ansible.builtin.set_fact:
        __pve_zpool_missing_devices: >-
          {{
            __pve_zpool_missing_devices | ansible.builtin.default({}) | ansible.builtin.combine({
              pool_name: existing_devices + (device_map
                | ansible.builtin.selectattr('exists', 'ansible.builtin.equalto', false)
                | ansible.builtin.map(attribute='by_id')
                | ansible.builtin.list)
            })
          }}
      vars:
        pool_name: "{{ __pve_proxmox_zpool_item['key'] }}"
        device_map: "{{ __pve_proxmox_zpool_item['value'] }}"
        existing_devices: "{{ (__pve_zpool_missing_devices | ansible.builtin.default({})).get(pool_name, []) }}"
      when:
        - __pve_zpool_device_map is ansible.builtin.defined
        - >-
          __pve_proxmox_zpool_item['value']
          | ansible.builtin.selectattr('exists', 'ansible.builtin.equalto', false)
          | ansible.builtin.list | ansible.builtin.length > 0


      loop: "{{ __pve_zpool_device_map | ansible.builtin.default({}) | ansible.builtin.dict2items }}"
      loop_control:
        loop_var: "__pve_proxmox_zpool_item"
        label: "{{ __pve_proxmox_zpool_item['key'] }}"
    - name: "Storage | ZFS | zpool | Fail if configured disks don't exist"
      ansible.builtin.fail:
        msg: |
          ERROR: Some disks for pool '{{ __pve_proxmox_missingdisk_item['key'] }}' do NOT exist on the system!

          Missing disks:
          {% for device in __pve_proxmox_missingdisk_item['value'] %}
            - {{ device }}
          {% endfor %}

          This usually means:
          1. Wrong disk path in configuration
          2. Disks not yet connected/visible
          3. Typo in disk ID

          To investigate:
          {% for device in __pve_proxmox_missingdisk_item['value'] %}
            # Check if disk exists
            ls -lah {{ device }}

            # List available disks
            ls -lah /dev/disk/by-id/
          {% endfor %}

          Actions:
          1. Verify disk paths are correct
          2. Check physical connections
          3. Run 'lsblk' to see available disks
          4. Update Ansible variables with correct paths

          Cannot proceed with pool creation until disks are available.
      when:
        - __pve_zpool_missing_devices is ansible.builtin.defined
        - __pve_zpool_missing_devices | ansible.builtin.length > 0

      loop: "{{ __pve_zpool_missing_devices | ansible.builtin.default({}) | ansible.builtin.dict2items }}"
      loop_control:
        loop_var: "__pve_proxmox_missingdisk_item"
    - name: "Storage | ZFS | zpool | Validate existing pool configuration matches expectations"
      ansible.builtin.assert:
        that:
          - >-
            (__pve_zpool_actual_devices[__pve_proxmox_poolvalidate_item['name']]['expected_devices']
             | ansible.builtin.difference(__pve_zpool_actual_devices[__pve_proxmox_poolvalidate_item['name']]['pool_devices'])
             | ansible.builtin.length) == 0
          - >-
            (__pve_zpool_actual_devices[__pve_proxmox_poolvalidate_item['name']]['pool_devices']
             | ansible.builtin.difference(__pve_zpool_actual_devices[__pve_proxmox_poolvalidate_item['name']]['expected_devices'])
             | ansible.builtin.length) == 0
        fail_msg: |
          ERROR: Pool '{{ __pve_proxmox_poolvalidate_item['name'] }}' exists but disk configuration does NOT match!

          Expected disks (from your configuration):
          {% for dev_info in __pve_zpool_device_map[__pve_proxmox_poolvalidate_item['name']] |
              ansible.builtin.selectattr('exists', 'ansible.builtin.equalto', true) %}
            - {{ dev_info['by_id'] }} → {{ dev_info['realpath'] }} ({{ dev_info['basename'] }})
          {% endfor %}

          Actual disks in pool (from zpool status):
          {% for dev in __pve_zpool_actual_devices[__pve_proxmox_poolvalidate_item['name']]['devices_found'] %}
            - {{ dev }}
          {% endfor %}

          Resolved base devices from pool: {{ __pve_zpool_actual_devices[__pve_proxmox_poolvalidate_item['name']]['pool_devices'] | ansible.builtin.list }}
          Expected base devices: {{ __pve_zpool_actual_devices[__pve_proxmox_poolvalidate_item['name']]['expected_devices'] | ansible.builtin.list }}

          Disks missing from pool:
          {{ __pve_zpool_actual_devices[__pve_proxmox_poolvalidate_item['name']]['expected_devices']
             | ansible.builtin.difference(__pve_zpool_actual_devices[__pve_proxmox_poolvalidate_item['name']]['pool_devices'])
             | ansible.builtin.list }}
          Extra disks in pool:
          {{ __pve_zpool_actual_devices[__pve_proxmox_poolvalidate_item['name']]['pool_devices']
             | ansible.builtin.difference(__pve_zpool_actual_devices[__pve_proxmox_poolvalidate_item['name']]['expected_devices'])
             | ansible.builtin.list }}

          To investigate:
          {% for dev_info in __pve_zpool_device_map[__pve_proxmox_poolvalidate_item['name']] |
              ansible.builtin.selectattr('exists', 'ansible.builtin.equalto', true) %}
            readlink -f {{ dev_info['by_id'] }}
          {% endfor %}
            zpool status {{ __pve_proxmox_poolvalidate_item['name'] }} -P

          Actions:
          1. Verify configuration lists correct disks (check for typos)
          2. Check if pool is missing disks that should be there
          3. If configuration is wrong, update Ansible variables
          4. If pool needs to be recreated (DESTRUCTIVE!):
              zpool destroy {{ __pve_proxmox_poolvalidate_item['name'] }}
              {% for dev_info in __pve_zpool_device_map[__pve_proxmox_poolvalidate_item['name']] |
              ansible.builtin.selectattr('exists', 'ansible.builtin.equalto', true) %}
              zpool labelclear -f {{ dev_info['by_id'] }}
              wipefs -a {{ dev_info['by_id'] }}
              partprobe {{ dev_info['by_id'] }} # reboot if recommended!
              {% endfor %}
              # Then re-run this playbook
        success_msg: "Pool '{{ __pve_proxmox_poolvalidate_item['name'] }}' exists with correct disk configuration"
      when:
        - pve_proxmox_storage is ansible.builtin.defined
        - pve_proxmox_storage | ansible.builtin.length > 0
        - __pve_zpool_actual_devices is ansible.builtin.defined
        - __pve_proxmox_poolvalidate_item['name'] in __pve_zpool_actual_devices
        - >-
          __pve_zpool_device_map[__pve_proxmox_poolvalidate_item['name']]
          | ansible.builtin.selectattr('exists', 'ansible.builtin.equalto', true)
          | ansible.builtin.list | ansible.builtin.length > 0


      loop: >-
        {{
          __pve_storage_sanitized
          | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'zpool')
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__pve_proxmox_poolvalidate_item"
    - name: "Storage | ZFS | zpool | Check which pool owns disks with ZFS labels"
      ansible.builtin.shell: |
        set -o pipefail
        zdb -l {{ __pve_proxmox_pool_owner_item['disk'] | ansible.builtin.quote }} 2>/dev/null | grep -oP '(?<=name: '\'')[^'\'']+' || echo "none"
      args:
        executable: "/bin/bash"
      when:
        - __pve_disk_check_list is ansible.builtin.defined
        - __pve_disk_check_list | ansible.builtin.length > 0

      changed_when:
        - false
      failed_when:
        - false
      loop: "{{ __pve_disk_check_list | ansible.builtin.default([]) }}"
      loop_control:
        loop_var: "__pve_proxmox_pool_owner_item"
        label: "{{ __pve_proxmox_pool_owner_item['pool'] }}: {{ __pve_proxmox_pool_owner_item['disk'] }}"
      register: __pve_storage_zfs_pool_owner
    - name: "Storage | ZFS | zpool | Detect disks belonging to different pools"
      ansible.builtin.set_fact:
        __pve_storage_wrong_pool_devices: >-
          {{
            __pve_storage_wrong_pool_devices | ansible.builtin.default({}) | ansible.builtin.combine({
              __pve_proxmox_wrong_pool_item['__pve_proxmox_pool_owner_item']['pool']: (
                  __pve_storage_wrong_pool_devices[__pve_proxmox_wrong_pool_item['__pve_proxmox_pool_owner_item']['pool']] | ansible.builtin.default([])
              ) + [
                {
                  'device': __pve_proxmox_wrong_pool_item['__pve_proxmox_pool_owner_item']['disk'],
                  'current_pool': __pve_proxmox_wrong_pool_item['stdout'] | ansible.builtin.trim,
                  'expected_pool': __pve_proxmox_wrong_pool_item['__pve_proxmox_pool_owner_item']['pool']
                }
              ]
            })
          }}
      when:
        - __pve_proxmox_wrong_pool_item['stdout'] is ansible.builtin.defined
        - __pve_proxmox_wrong_pool_item['stdout'] | ansible.builtin.trim != 'none'
        - __pve_proxmox_wrong_pool_item['stdout'] | ansible.builtin.trim != __pve_proxmox_wrong_pool_item['__pve_proxmox_pool_owner_item']['pool']

      loop: "{{ __pve_storage_zfs_pool_owner['results'] | ansible.builtin.default([]) }}"
      loop_control:
        loop_var: "__pve_proxmox_wrong_pool_item"
    - name: "Storage | ZFS | zpool | Fail if disks belong to different pools"
      ansible.builtin.fail:
        msg: |
          ERROR: Disks for pool '{{ __pve_proxmox_wrong_pool_fail_item['key'] }}' have ZFS labels from DIFFERENT pools!

          This indicates the disks were previously used in other ZFS pools.

          Disk conflicts:
          {% for conflict in __pve_proxmox_wrong_pool_fail_item['value'] %}
            - Disk: {{ conflict['device'] }}
              Currently labeled for pool: {{ conflict['current_pool'] }}
              Expected pool: {{ conflict['expected_pool'] }}
          {% endfor %}

          This is a SAFETY ERROR to prevent accidental data destruction.

          Manual remediation required:
          1. Verify you have the correct disk IDs in your configuration
          2. Check if data from '{{ __pve_proxmox_wrong_pool_fail_item['value'][0]['current_pool'] }}' is still needed
          3. If safe to proceed, manually clear the labels:
          {% for conflict in __pve_proxmox_wrong_pool_fail_item['value'] %}
              zpool labelclear -f {{ conflict['device'] }}
              wipefs -a {{ conflict['device'] }}
          {% endfor %}

          DO NOT set pve_proxmox_storage_force_cleanup=true to bypass this check!
          This requires manual verification to prevent data loss.
      when:
        - __pve_storage_wrong_pool_devices is ansible.builtin.defined
        - __pve_storage_wrong_pool_devices | ansible.builtin.length > 0

      loop: "{{ __pve_storage_wrong_pool_devices | ansible.builtin.default({}) | ansible.builtin.dict2items }}"
      loop_control:
        loop_var: "__pve_proxmox_wrong_pool_fail_item"
    - name: "Storage | ZFS | zpool | Fail if disks have data but pool doesn't exist as expected"
      ansible.builtin.fail:
        msg: |
          ERROR: Storage disks for pool '{{ __pve_proxmox_pool_data_fail_item['name'] }}' contain existing data but pool does not exist.

          Current situation:
            - Pool '{{ __pve_proxmox_pool_data_fail_item['name'] }}' does NOT exist
            - Disks have existing partitions or ZFS labels
            - This may indicate:
              a) Disks were used for something else
              b) Pool was partially destroyed
              c) Configuration mismatch

          Disks with data:
          {% for disk in __pve_zpool_all_disks[__pve_proxmox_pool_data_fail_item['name']] %}
            - {{ disk }}
          {% endfor %}

          To investigate:
            # Check what's on the disks
          {% for disk in __pve_zpool_all_disks[__pve_proxmox_pool_data_fail_item['name']] %}
            blkid {{ disk }}
            zdb -l {{ disk }}
            readlink -f {{ disk }}
          {% endfor %}

          Manual remediation:
          1. Verify disks are correct and data is not needed
          2. Clean the disks:
          {% for disk in __pve_zpool_all_disks[__pve_proxmox_pool_data_fail_item['name']] %}
              zpool labelclear -f {{ disk }}
              umount {{ disk }}*
              wipefs -af {{ disk }}
              partprobe {{ disk }} # reboot if recommended!
          {% endfor %}
          3. Re-run this playbook

          ALTERNATIVE: Set 'pve_proxmox_storage_force_cleanup: true' to automatically wipe disks.
          WARNING: This will DESTROY ALL DATA on these disks!
          Only use this if you are CERTAIN the data is not needed.
      when:
        - pve_proxmox_storage is ansible.builtin.defined
        - pve_proxmox_storage | ansible.builtin.length > 0
        - __pve_storage_pool_data_status[__pve_proxmox_pool_data_fail_item['name']]['has_data'] | ansible.builtin.default(false) | ansible.builtin.bool
        - not __pve_storage_pool_data_status[__pve_proxmox_pool_data_fail_item['name']]['exists'] | ansible.builtin.default(false) | ansible.builtin.bool
        - not (pve_proxmox_storage_force_cleanup | ansible.builtin.default(false) | ansible.builtin.bool)
        - __pve_proxmox_pool_data_fail_item['name'] not in (__pve_storage_wrong_pool_devices | ansible.builtin.default({}) | ansible.builtin.list)

      loop: >-
        {{
          __pve_storage_sanitized
          | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'zpool')
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__pve_proxmox_pool_data_fail_item"
    - name: "Storage | ZFS | zpool | Clean disks - wipe filesystem signatures (DESTRUCTIVE)"
      ansible.builtin.command:
        argv:
          - "wipefs"
          - "-a"
          - "{{ __pve_proxmox_wipe_item['disk'] }}"
      when:
        - __pve_disk_check_list is ansible.builtin.defined
        - __pve_disk_check_list | ansible.builtin.length > 0
        - __pve_storage_pool_data_status[__pve_proxmox_wipe_item['pool']]['has_data'] | ansible.builtin.default(false) | ansible.builtin.bool
        - not __pve_storage_pool_data_status[__pve_proxmox_wipe_item['pool']]['exists'] | ansible.builtin.default(false) | ansible.builtin.bool
        - pve_proxmox_storage_force_cleanup | ansible.builtin.default(false) | ansible.builtin.bool
      changed_when:
        - true

      loop: "{{ __pve_disk_check_list | ansible.builtin.default([]) }}"
      loop_control:
        loop_var: "__pve_proxmox_wipe_item"
        label: "{{ __pve_proxmox_wipe_item['pool'] }}: wipefs {{ __pve_proxmox_wipe_item['disk'] }}"
    - name: "Storage | ZFS | zpool | Clean disks - clear ZFS labels (best effort) (DESTRUCTIVE)"
      ansible.builtin.command:
        argv:
          - "zpool"
          - "labelclear"
          - "-f"
          - "{{ __pve_proxmox_zfs_label_clear_item['disk'] }}"
      when:
        - __pve_disk_check_list is ansible.builtin.defined
        - __pve_disk_check_list | ansible.builtin.length > 0
        - __pve_storage_pool_data_status[__pve_proxmox_zfs_label_clear_item['pool']]['has_data'] | ansible.builtin.default(false) | ansible.builtin.bool
        - not __pve_storage_pool_data_status[__pve_proxmox_zfs_label_clear_item['pool']]['exists'] | ansible.builtin.default(false) | ansible.builtin.bool
        - pve_proxmox_storage_force_cleanup | ansible.builtin.default(false) | ansible.builtin.bool
      changed_when:
        - true
      failed_when:
        - false

      loop: "{{ __pve_disk_check_list | ansible.builtin.default([]) }}"
      loop_control:
        loop_var: "__pve_proxmox_zfs_label_clear_item"
        label: "{{ __pve_proxmox_zfs_label_clear_item['pool'] }}: labelclear {{ __pve_proxmox_zfs_label_clear_item['disk'] }}"
    - name: "Storage | ZFS | zpool | Ensure mountpoint directories"
      ansible.builtin.file:
        path: "{{ __pve_zfs_mountpoint }}"
        state: "directory"
        owner: "root"
        group: "root"
        mode: "u=rwx,g=rx,o=rx" # 0755
      vars:
        __pve_zfs_mountpoint: "{{ __pve_proxmox_pool_mountdir_item['attributes']['zfs_properties']['mountpoint'] | ansible.builtin.default('') }}"
      when:
        - pve_proxmox_storage is ansible.builtin.defined
        - pve_proxmox_storage | ansible.builtin.length > 0
        - __pve_zfs_mountpoint != ''
        - __pve_zfs_mountpoint != 'none'
      loop: >-
        {{
          __pve_storage_sanitized
          | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'zpool')
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__pve_proxmox_pool_mountdir_item"

    - name: "Storage | ZFS | zpool | Create ZFS pools"
      community.general.zpool:
        name: "{{ __pve_proxmox_pool_create_item['name'] }}"
        state: "present"
        vdevs: "{{ __pve_proxmox_pool_create_item['attributes']['vdevs'] }}"
        filesystem_properties: "{{ __pve_proxmox_pool_create_item['attributes']['filesystem_properties'] | ansible.builtin.default({}) }}"
        pool_properties: "{{ __pve_proxmox_pool_create_item['attributes']['pool_properties'] | ansible.builtin.default({}) }}"
        mountpoint: "{{ __pve_proxmox_pool_create_item['attributes']['mountpoint'] | ansible.builtin.default(omit) }}"
        altroot: "{{ __pve_proxmox_pool_create_item['attributes']['altroot'] | ansible.builtin.default(omit) }}"
        disable_new_features: >-
          {{ __pve_proxmox_pool_create_item['attributes']['disable_new_features']
             | ansible.builtin.default(false) | ansible.builtin.bool }}
      when:
        - pve_proxmox_storage is ansible.builtin.defined
        - pve_proxmox_storage | ansible.builtin.length > 0
        - not __pve_storage_pool_data_status[__pve_proxmox_pool_create_item['name']]['exists'] | ansible.builtin.default(false) | ansible.builtin.bool

      loop: >-
        {{
          __pve_storage_sanitized
          | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'zpool')
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__pve_proxmox_pool_create_item"
    - name: "Storage | ZFS | zpool | Update pool properties if pool exists"
      community.general.zfs:
        name: "{{ __pve_proxmox_pool_update_item['name'] }}"
        state: "present"
        # creation-only keys are excluded: they cannot be changed with
        # "zfs set" on an existing pool root dataset
        extra_zfs_properties: >-
          {{
            __pve_proxmox_pool_update_item['attributes']['zfs_properties'] | ansible.builtin.default({})
            | ansible.builtin.dict2items
            | ansible.builtin.rejectattr('key', 'ansible.builtin.in', ['encryption', 'keyformat', 'keylocation', 'passphrase', 'passphrase_old'])
            | ansible.builtin.items2dict
          }}
      when:
        - pve_proxmox_storage is ansible.builtin.defined
        - pve_proxmox_storage | ansible.builtin.length > 0
        - __pve_storage_pool_data_status[__pve_proxmox_pool_update_item['name']]['exists'] | ansible.builtin.default(false) | ansible.builtin.bool
        # zfs_properties on purpose: storage_properties is the pvesm/NFS
        # field, gating on it made this reconciliation dead code
        - __pve_proxmox_pool_update_item['attributes']['zfs_properties'] is ansible.builtin.defined

      loop: >-
        {{
          __pve_storage_sanitized
          | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'zpool')
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__pve_proxmox_pool_update_item"
    - name: "Storage | ZFS | zfs_dataset | Gather existing ZFS datasets"
      ansible.builtin.command:
        argv:
          - "zfs"
          - "list"
          - "-H"
          - "-p"
          - "-o"
          - "name,type"
          - "-t"
          - "filesystem,volume"
          - "--"
          - "{{ __pve_proxmox_dataset_facts_item['name'] }}"
        expand_argument_vars: false
        strip_empty_ends: false
      environment:
        LC_ALL: "C"
      check_mode: false
      when:
        - pve_proxmox_storage is ansible.builtin.defined
        - pve_proxmox_storage | ansible.builtin.length > 0

      changed_when:
        - false
      failed_when:
        - false
      loop: >-
        {{
          __pve_storage_sanitized
          | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'zfs_dataset')
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__pve_proxmox_dataset_facts_item"
      register: __pve_zfs_dataset_facts

    - name: "Storage | ZFS | zfs_dataset | Validate dataset discovery coverage"
      ansible.builtin.assert:
        that:
          - __pve_zfs_dataset_facts['results'] is ansible.builtin.sequence
          - __pve_zfs_dataset_facts['results'] is not ansible.builtin.string
          - __pve_zfs_dataset_facts['results'] is not ansible.builtin.mapping
          - >-
            (__pve_zfs_dataset_facts['results']
             | ansible.builtin.map(attribute='__pve_proxmox_dataset_facts_item.name') | ansible.builtin.list)
            == (__pve_storage_sanitized
                | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'zfs_dataset')
                | ansible.builtin.map(attribute='name') | ansible.builtin.list)
        fail_msg: "Incomplete ZFS dataset discovery; refusing dataset changes."
        quiet: true

    - name: "Storage | ZFS | zfs_dataset | Validate dataset discovery results"
      ansible.builtin.assert:
        that:
          - not (__pve_zfs_discovery_item['skipped'] | ansible.builtin.default(false))
          - __pve_zfs_discovery_item['rc'] is ansible.builtin.integer
          - __pve_zfs_discovery_item['stdout'] is ansible.builtin.string
          - __pve_zfs_discovery_item['stderr'] is ansible.builtin.string
          - >-
            ((__pve_zfs_discovery_item['rc'] == 0)
             and (__pve_zfs_discovery_item['stderr'] == '')
             and (__pve_zfs_discovery_item['stdout'] in
                  [__pve_zfs_discovery_name ~ __pve_zfs_discovery_tab ~ 'filesystem' ~ __pve_zfs_discovery_newline,
                   __pve_zfs_discovery_name ~ __pve_zfs_discovery_tab ~ 'volume' ~ __pve_zfs_discovery_newline]))
            or ((__pve_zfs_discovery_item['rc'] == 1)
                and (__pve_zfs_discovery_item['stdout'] == '')
                and (__pve_zfs_discovery_item['stderr'] ==
                     ("cannot open '" ~ __pve_zfs_discovery_name ~ "': dataset does not exist" ~ __pve_zfs_discovery_newline)))
        fail_msg: "Cannot establish ZFS dataset presence; refusing dataset changes."
        quiet: true
      vars:
        __pve_zfs_discovery_name: "{{ __pve_zfs_discovery_item['__pve_proxmox_dataset_facts_item']['name'] }}"
        __pve_zfs_discovery_tab: "{{ '%c' | ansible.builtin.format(9) }}"
        __pve_zfs_discovery_newline: "\n"
      loop: "{{ __pve_zfs_dataset_facts['results'] }}"
      loop_control:
        loop_var: "__pve_zfs_discovery_item"
        label: "{{ __pve_zfs_discovery_item['__pve_proxmox_dataset_facts_item']['name'] }}"

    - name: "Storage | ZFS | zfs_dataset | Verify imported root for absent datasets"
      ansible.builtin.command:
        argv:
          - "zfs"
          - "list"
          - "-H"
          - "-p"
          - "-o"
          - "name,type"
          - "-t"
          - "filesystem,volume"
          - "--"
          - "{{ __pve_zfs_root_probe_item['__pve_proxmox_dataset_facts_item']['name'].split('/')[0] }}"
        expand_argument_vars: false
        strip_empty_ends: false
      environment:
        LC_ALL: "C"
      check_mode: false
      when:
        - not (__pve_zfs_root_probe_item['skipped'] | ansible.builtin.default(false))
        - __pve_zfs_root_probe_item['rc'] == 1
      changed_when:
        - false
      failed_when:
        - false
      loop: "{{ __pve_zfs_dataset_facts['results'] }}"
      loop_control:
        loop_var: "__pve_zfs_root_probe_item"
        label: "{{ __pve_zfs_root_probe_item['__pve_proxmox_dataset_facts_item']['name'] }}"
      register: __pve_zfs_dataset_roots

    - name: "Storage | ZFS | zfs_dataset | Validate imported root discovery coverage"
      ansible.builtin.assert:
        that:
          - __pve_zfs_dataset_roots['results'] is ansible.builtin.sequence
          - __pve_zfs_dataset_roots['results'] is not ansible.builtin.string
          - __pve_zfs_dataset_roots['results'] is not ansible.builtin.mapping
          - >-
            (__pve_zfs_dataset_roots['results']
             | ansible.builtin.map(attribute='__pve_zfs_root_probe_item.__pve_proxmox_dataset_facts_item.name') | ansible.builtin.list)
            == (__pve_zfs_dataset_facts['results']
                | ansible.builtin.map(attribute='__pve_proxmox_dataset_facts_item.name') | ansible.builtin.list)
          - >-
            (__pve_zfs_dataset_roots['results']
             | ansible.builtin.map(attribute='__pve_zfs_root_probe_item.rc') | ansible.builtin.list)
            == (__pve_zfs_dataset_facts['results'] | ansible.builtin.map(attribute='rc') | ansible.builtin.list)
        fail_msg: "Incomplete imported-root discovery; refusing dataset creation."
        quiet: true

    - name: "Storage | ZFS | zfs_dataset | Validate imported dataset roots"
      ansible.builtin.assert:
        that:
          - __pve_zfs_root_result_item['__pve_zfs_root_probe_item']['rc'] is ansible.builtin.integer
          - __pve_zfs_root_result_item['__pve_zfs_root_probe_item']['rc'] in [0, 1]
          - >-
            ((__pve_zfs_root_result_item['__pve_zfs_root_probe_item']['rc'] == 0)
             and (__pve_zfs_root_result_item['skipped'] | ansible.builtin.default(false)))
            or ((__pve_zfs_root_result_item['__pve_zfs_root_probe_item']['rc'] == 1)
                and not (__pve_zfs_root_result_item['skipped'] | ansible.builtin.default(false))
                and (__pve_zfs_root_result_item['rc'] is ansible.builtin.integer)
                and (__pve_zfs_root_result_item['stdout'] is ansible.builtin.string)
                and (__pve_zfs_root_result_item['stderr'] is ansible.builtin.string)
                and (__pve_zfs_root_result_item['rc'] == 0)
                and (__pve_zfs_root_result_item['stderr'] == '')
                and (__pve_zfs_root_result_item['stdout'] == (__pve_zfs_root_name ~ __pve_zfs_root_suffix)))
        fail_msg: "Cannot verify the imported pool root; refusing dataset creation."
        quiet: true
      vars:
        __pve_zfs_root_name: "{{ __pve_zfs_root_result_item['__pve_zfs_root_probe_item']['__pve_proxmox_dataset_facts_item']['name'].split('/')[0] }}"
        __pve_zfs_root_suffix: "{{ '%cfilesystem%c' | ansible.builtin.format(9, 10) }}"
      loop: "{{ __pve_zfs_dataset_roots['results'] }}"
      loop_control:
        loop_var: "__pve_zfs_root_result_item"
        label: "{{ __pve_zfs_root_result_item['__pve_zfs_root_probe_item']['__pve_proxmox_dataset_facts_item']['name'] }}"

    - name: "Storage | ZFS | zfs_dataset | Build zfs_dataset existence map"
      ansible.builtin.set_fact:
        __pve_zfs_dataset_exists: >-
          {{
            __pve_zfs_dataset_exists | ansible.builtin.default({}) | ansible.builtin.combine({
              __pve_proxmox_dataset_map_item['__pve_proxmox_dataset_facts_item']['name']: (__pve_proxmox_dataset_map_item['rc'] == 0)
            })
          }}
      when:
        - __pve_zfs_dataset_facts is ansible.builtin.defined
        - not (__pve_proxmox_dataset_map_item['skipped'] | ansible.builtin.default(false))

      loop: "{{ __pve_zfs_dataset_facts['results'] | ansible.builtin.default([]) }}"
      loop_control:
        loop_var: "__pve_proxmox_dataset_map_item"
    - name: "Storage | ZFS | zfs_dataset | Check encryption status of existing volumes"
      ansible.builtin.command:
        argv:
          - "zfs"
          - "get"
          - "-H"
          - "-o"
          - "value"
          - "encryption"
          - "{{ __pve_proxmox_dataset_enc_item['name'] }}"
      when:
        - pve_proxmox_storage is ansible.builtin.defined
        - pve_proxmox_storage | ansible.builtin.length > 0
        - __pve_zfs_dataset_exists[__pve_proxmox_dataset_enc_item['name']] | ansible.builtin.default(false) | ansible.builtin.bool
        - __pve_proxmox_dataset_enc_item['attributes']['zfs_properties']['encryption'] is ansible.builtin.defined
      changed_when:
        - false
      check_mode: false
      loop: >-
        {{
          __pve_storage_sanitized
          | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'zfs_dataset')
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__pve_proxmox_dataset_enc_item"
      register: __pve_zfs_dataset_encryption_check

    - name: "Storage | ZFS | zfs_dataset | Validate existing dataset encryption"
      ansible.builtin.assert:
        that:
          - >-
            __pve_zfs_encryption_actual in
            ['off', 'aes-128-ccm', 'aes-192-ccm', 'aes-256-ccm', 'aes-128-gcm', 'aes-192-gcm', 'aes-256-gcm']
          - >-
            (__pve_zfs_encryption_actual == __pve_zfs_encryption_desired)
            or ((__pve_zfs_encryption_desired == 'on')
                and (__pve_zfs_encryption_actual in
                  ['aes-128-ccm', 'aes-192-ccm', 'aes-256-ccm', 'aes-128-gcm', 'aes-192-gcm', 'aes-256-gcm']))
        fail_msg: >-
          Existing dataset encryption does not match the declaration for
          '{{ __pve_proxmox_encryption_verify_item['__pve_proxmox_dataset_enc_item']['name'] }}'.
          Refusing dataset changes; encryption cannot be converted in place.
        quiet: true
      vars:
        __pve_zfs_encryption_actual: "{{ __pve_proxmox_encryption_verify_item['stdout'] | ansible.builtin.default('') }}"
        __pve_zfs_encryption_desired: >-
          {{ __pve_proxmox_encryption_verify_item['__pve_proxmox_dataset_enc_item']['attributes']['zfs_properties']['encryption'] }}
      when:
        - not (__pve_proxmox_encryption_verify_item['skipped'] | ansible.builtin.default(false))
      loop: "{{ __pve_zfs_dataset_encryption_check['results'] }}"
      loop_control:
        loop_var: "__pve_proxmox_encryption_verify_item"
        label: "{{ __pve_proxmox_encryption_verify_item['__pve_proxmox_dataset_enc_item']['name'] }}"

    - name: "Storage | ZFS | zfs_dataset | Validate rotation passphrase framing"
      ansible.builtin.assert:
        that:
          - >-
            (__pve_zfs_rotation_keys | ansible.builtin.select('ansible.builtin.string') | ansible.builtin.length)
            == (__pve_zfs_rotation_keys | ansible.builtin.length)
          - >-
            (__pve_zfs_rotation_keys | ansible.builtin.select('ansible.builtin.search', __pve_zfs_forbidden_key_chars)
             | ansible.builtin.length) == 0
        fail_msg: "ZFS rotation passphrases must be single-line strings without NUL bytes."
        quiet: true
      vars:
        __pve_zfs_rotation_old_raw: "{{ __pve_proxmox_passphrase_validate_item['attributes']['zfs_properties']['passphrase_old'] }}"
        __pve_zfs_rotation_keys: >-
          {{
            [__pve_proxmox_passphrase_validate_item['attributes']['zfs_properties']['passphrase']]
            + ([__pve_zfs_rotation_old_raw] if (__pve_zfs_rotation_old_raw is ansible.builtin.string)
               else (__pve_zfs_rotation_old_raw | ansible.builtin.default([], true)))
          }}
        __pve_zfs_forbidden_key_chars: "[\\r\\n\\x00]"
      when:
        - __pve_zfs_dataset_exists[__pve_proxmox_passphrase_validate_item['name']] | ansible.builtin.default(false) | ansible.builtin.bool
        - __pve_proxmox_passphrase_validate_item['attributes']['zfs_properties']['encryption'] is ansible.builtin.defined
        - __pve_proxmox_passphrase_validate_item['attributes']['zfs_properties']['passphrase'] is ansible.builtin.defined
        - __pve_proxmox_passphrase_validate_item['attributes']['zfs_properties']['passphrase_old'] is ansible.builtin.defined
        - __pve_proxmox_passphrase_validate_item['attributes']['zfs_properties']['passphrase_old'] is not ansible.builtin.none
      loop: >-
        {{
          pve_proxmox_storage | ansible.builtin.default([], true)
          | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'zfs_dataset')
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__pve_proxmox_passphrase_validate_item"
      no_log: true

    - name: "Storage | ZFS | zfs_dataset | Create encrypted ZFS volumes with prompt-based passphrase"
      # community.general.zfs cannot handle keylocation "prompt". The
      # passphrase is passed via stdin on purpose (zfs reads the key from
      # stdin without a confirmation prompt when it is not a TTY): embedded
      # in the command text it would be world-readable in the process list
      # (/proc/<pid>/cmdline) of the host while the command runs.
      ansible.builtin.command:
        argv: >-
          {%- set __pve_zfs_create_args = ['zfs', 'create',
                '-o', 'encryption=' ~ __pve_proxmox_dataset_enc_prompt_item['attributes']['zfs_properties']['encryption'],
                '-o', 'keyformat=' ~ __pve_proxmox_dataset_enc_prompt_item['attributes']['zfs_properties']['keyformat'],
                '-o', 'keylocation=prompt'] -%}
          {%- for key, value in __pve_proxmox_dataset_enc_prompt_item['attributes']['zfs_properties'].items() -%}
          {%-   if key not in ['encryption', 'keyformat', 'keylocation', 'passphrase', 'passphrase_old'] -%}
          {%-     set _ = __pve_zfs_create_args.append('-o') -%}
          {%-     set _ = __pve_zfs_create_args.append(key ~ '=' ~ value) -%}
          {%-   endif -%}
          {%- endfor -%}
          {%- set _ = __pve_zfs_create_args.append(__pve_proxmox_dataset_enc_prompt_item['name']) -%}
          {{ __pve_zfs_create_args }}
        stdin: "{{ __pve_proxmox_dataset_enc_prompt_item['attributes']['zfs_properties']['passphrase'] }}"
      when:
        - pve_proxmox_storage is ansible.builtin.defined
        - pve_proxmox_storage | ansible.builtin.length > 0
        - not __pve_zfs_dataset_exists[__pve_proxmox_dataset_enc_prompt_item['name']] | ansible.builtin.default(false) | ansible.builtin.bool
        - __pve_proxmox_dataset_enc_prompt_item['attributes']['zfs_properties']['encryption'] is ansible.builtin.defined
        - __pve_proxmox_dataset_enc_prompt_item['attributes']['zfs_properties']['encryption'] != 'off'
        - __pve_proxmox_dataset_enc_prompt_item['attributes']['zfs_properties']['keylocation'] | ansible.builtin.default('prompt') == 'prompt'
      changed_when:
        - true
      loop: >-
        {{
          pve_proxmox_storage | ansible.builtin.default([], true)
          | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'zfs_dataset')
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__pve_proxmox_dataset_enc_prompt_item"
      no_log: true

    - name: "Storage | ZFS | zfs_dataset | Create encrypted ZFS volumes with non-prompt-based key (like file://)"
      # ansible.builtin.shell is used because community.general.zfs cannot handle
      # keylocation: "file://..." properly with encryption properties
      ansible.builtin.shell: |
        set -o pipefail
        zfs create \
          -o encryption={{ __pve_proxmox_dataset_enc_key_item['attributes']['zfs_properties']['encryption'] | ansible.builtin.quote }} \
          -o keyformat={{ __pve_proxmox_dataset_enc_key_item['attributes']['zfs_properties']['keyformat'] | ansible.builtin.quote }} \
          -o keylocation={{ __pve_proxmox_dataset_enc_key_item['attributes']['zfs_properties']['keylocation'] | ansible.builtin.quote }} \
        {% for key, value in __pve_proxmox_dataset_enc_key_item['attributes']['zfs_properties'].items() %}
        {% if key not in ['encryption', 'keyformat', 'keylocation', 'passphrase', 'passphrase_old'] %}
          -o {{ key }}={{ value | ansible.builtin.quote }} \
        {% endif %}
        {% endfor %}
        {{ __pve_proxmox_dataset_enc_key_item['name'] | ansible.builtin.quote }}
      args:
        executable: "/bin/bash"
      when:
        - pve_proxmox_storage is ansible.builtin.defined
        - pve_proxmox_storage | ansible.builtin.length > 0
        - not __pve_zfs_dataset_exists[__pve_proxmox_dataset_enc_key_item['name']] | ansible.builtin.default(false) | ansible.builtin.bool
        - __pve_proxmox_dataset_enc_key_item['attributes']['zfs_properties']['encryption'] is ansible.builtin.defined
        - __pve_proxmox_dataset_enc_key_item['attributes']['zfs_properties']['encryption'] != 'off'
        - __pve_proxmox_dataset_enc_key_item['attributes']['zfs_properties']['keylocation'] is ansible.builtin.defined
        - __pve_proxmox_dataset_enc_key_item['attributes']['zfs_properties']['keylocation'] != 'prompt'
      changed_when:
        - true

      loop: >-
        {{
          __pve_storage_sanitized
          | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'zfs_dataset')
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__pve_proxmox_dataset_enc_key_item"
    - name: "Storage | ZFS | zfs_dataset | Ensure mountpoint directories"
      ansible.builtin.file:
        path: "{{ __pve_zfs_mountpoint }}"
        state: "directory"
        owner: "root"
        group: "root"
        mode: "u=rwx,g=rx,o=rx" # 0755
      vars:
        __pve_zfs_mountpoint: "{{ __pve_proxmox_dataset_mountdir_item['attributes']['zfs_properties']['mountpoint'] | ansible.builtin.default('') }}"
      when:
        - pve_proxmox_storage is ansible.builtin.defined
        - pve_proxmox_storage | ansible.builtin.length > 0
        - __pve_zfs_mountpoint != ''
        - __pve_zfs_mountpoint != 'none'
      loop: >-
        {{
          __pve_storage_sanitized
          | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'zfs_dataset')
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__pve_proxmox_dataset_mountdir_item"

    - name: "Storage | ZFS | zfs_dataset | Create non-encrypted ZFS volumes"
      community.general.zfs:
        name: "{{ __pve_proxmox_dataset_plain_item['name'] }}"
        state: "present"
        extra_zfs_properties: "{{ __pve_proxmox_dataset_plain_item['attributes']['zfs_properties'] | ansible.builtin.default({}) }}"
      when:
        - pve_proxmox_storage is ansible.builtin.defined
        - pve_proxmox_storage | ansible.builtin.length > 0
        - not __pve_zfs_dataset_exists[__pve_proxmox_dataset_plain_item['name']] | ansible.builtin.default(false) | ansible.builtin.bool
        - >-
          (__pve_proxmox_dataset_plain_item['attributes']['zfs_properties']['encryption'] is not ansible.builtin.defined)
          or (__pve_proxmox_dataset_plain_item['attributes']['zfs_properties']['encryption'] == 'off')

      loop: >-
        {{
          __pve_storage_sanitized
          | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'zfs_dataset')
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__pve_proxmox_dataset_plain_item"
    - name: "Storage | ZFS | zfs_dataset | Update properties on existing non-encrypted ZFS volumes"
      community.general.zfs:
        name: "{{ __pve_proxmox_dataset_update_item['name'] }}"
        state: "present"
        extra_zfs_properties: >-
          {{
            __pve_proxmox_dataset_update_item['attributes']['zfs_properties'] | ansible.builtin.default({})
            | ansible.builtin.dict2items
            | ansible.builtin.rejectattr('key', 'ansible.builtin.in', ['encryption', 'keyformat', 'keylocation', 'passphrase', 'passphrase_old'])
            | ansible.builtin.items2dict
          }}
      when:
        - pve_proxmox_storage is ansible.builtin.defined
        - pve_proxmox_storage | ansible.builtin.length > 0
        - __pve_zfs_dataset_exists[__pve_proxmox_dataset_update_item['name']] | ansible.builtin.default(false) | ansible.builtin.bool

      loop: >-
        {{
          __pve_storage_sanitized
          | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'zfs_dataset')
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__pve_proxmox_dataset_update_item"
    - name: "Storage | ZFS | zfs_dataset | Manage encryption key changes"
      ansible.builtin.shell:
        cmd: |
          set +x
          set +a
          set -u # Fail on unset vars
          set -o pipefail # Fail if any pipe cmd fail

          unset __PVE_ZFS_PASS_NEW __PVE_ZFS_PASSES_OLD __pve_pass __pve_old_pass_working
          case "${__PVE_ZFS_DATASET}" in
            ''|-*|*$'\r'*|*$'\n'*)
              printf '%s\n' "ERROR - Invalid dataset identity; refusing rotation" >&2
              exit 1
              ;;
          esac
          IFS= read -r __PVE_ZFS_PASS_NEW || exit 1
          __PVE_ZFS_PASSES_OLD="$(cat)" || exit 1

          # If no old passphrases provided: nothing to do
          if [ -z "${__PVE_ZFS_PASSES_OLD}" ]; then
            exit 0
          fi

          if ! __pve_keyformat="$(zfs get -H -o value keyformat "${__PVE_ZFS_DATASET}" 2>/dev/null)" \
            || ! __pve_keylocation="$(zfs get -H -o value keylocation "${__PVE_ZFS_DATASET}" 2>/dev/null)" \
            || ! __pve_encryptionroot="$(zfs get -H -o value encryptionroot "${__PVE_ZFS_DATASET}" 2>/dev/null)"; then
            printf '%s\n' "ERROR - Cannot verify encryption properties before rotation" >&2
            exit 1
          fi
          if [ "${__pve_keyformat}" != 'passphrase' ] \
            || [ "${__pve_keylocation}" != 'prompt' ] \
            || [ "${__pve_encryptionroot}" != "${__PVE_ZFS_DATASET}" ]; then
            printf '%s\n' "ERROR - Rotation requires a declared encryption root with prompt-based passphrase keys" >&2
            exit 1
          fi

          __pve_verify_passphrase() {
            local __pve_key_check_output __pve_key_check_status __pve_invalid_key_output
            __pve_key_check_output="$(zfs load-key -n -L prompt "${__PVE_ZFS_DATASET}" 2>&1)"
            __pve_key_check_status=$?
            if [ "${__pve_key_check_status}" -eq 0 ] \
              && [ "${__pve_key_check_output}" = '1 / 1 key(s) successfully verified' ]; then
              return 0
            fi
            __pve_invalid_key_output="$(printf "Key load error: Incorrect key provided for '%s'.\n0 / 1 key(s) successfully verified" \
              "${__PVE_ZFS_DATASET}")"
            if [ "${__pve_key_check_status}" -eq 255 ] \
              && [ "${__pve_key_check_output}" = "${__pve_invalid_key_output}" ]; then
              return 1
            fi
            return 2
          }

          # If new passphrase is already set: nothing to do
          printf '%s\n' "${__PVE_ZFS_PASS_NEW}" | __pve_verify_passphrase
          __pve_key_check_status=$?
          if [ "${__pve_key_check_status}" -eq 0 ]; then
            exit 0
          fi
          if [ "${__pve_key_check_status}" -ne 1 ]; then
            printf '%s\n' "ERROR - Current passphrase verification is indeterminate; refusing rotation" >&2
            exit 1
          fi

          # Try to verify each old passphrase with -n (test mode)
          __pve_old_pass_working=""
          while IFS= read -r __pve_pass; do
            [ -n "${__pve_pass}" ] || continue
            printf '%s\n' "${__pve_pass}" | __pve_verify_passphrase
            __pve_key_check_status=$?
            if [ "${__pve_key_check_status}" -eq 0 ]; then
              __pve_old_pass_working="${__pve_pass}"
              break
            fi
            if [ "${__pve_key_check_status}" -ne 1 ]; then
              printf '%s\n' "ERROR - Previous passphrase verification is indeterminate; refusing rotation" >&2
              exit 1
            fi
          done <<< "${__PVE_ZFS_PASSES_OLD}"
          unset __pve_pass

          # Fail if none of the old passphrases worked
          if [ -z "${__pve_old_pass_working}" ]; then
            printf '%s\n' "ERROR - None of the old passphrases for '${__PVE_ZFS_DATASET}' worked" >&2
            exit 1
          fi

          # Try to load the key with old passphrase (providing the old one is a prerequisite for changing it)
          __pve_load_key_error=$(printf '%s\n' "${__pve_old_pass_working}" | zfs load-key -L prompt "${__PVE_ZFS_DATASET}" 2>&1)
          __pve_load_key_status=$?
          if [ ${__pve_load_key_status} -ne 0 ]; then
            if [ "${__pve_load_key_status}" -ne 255 ] \
              || [ "${__pve_load_key_error}" != "Key load error: Key already loaded for '${__PVE_ZFS_DATASET}'." ]; then
              printf '%s\n' "ERROR - Failed to load verified key; refusing rotation" >&2
              exit 1
            fi
          fi

          # Change the passphrase
          if printf '%s\n' "${__PVE_ZFS_PASS_NEW}" | zfs change-key "${__PVE_ZFS_DATASET}" 2>&1; then
            # Verify the new passphrase was set correctly
            if printf '%s\n' "${__PVE_ZFS_PASS_NEW}" | __pve_verify_passphrase; then
              printf '%s\n' "SUCCESS - Passphrase for '${__PVE_ZFS_DATASET}' changed and verified"
              exit 0
            else
              printf '%s\n' "ERROR - Passphrase changed but verification failed for '${__PVE_ZFS_DATASET}'" >&2
              exit 1
            fi
          else
            printf '%s\n' "ERROR - Failed to change passphrase for '${__PVE_ZFS_DATASET}'" >&2
            exit 1
          fi
        executable: "/bin/bash"
        stdin: >-
          {{
            ([__pve_proxmox_passphrase_item['attributes']['zfs_properties']['passphrase']]
             + ([__pve_zfs_passes_old_raw] if (__pve_zfs_passes_old_raw is ansible.builtin.string)
                else (__pve_zfs_passes_old_raw | ansible.builtin.default([], true))))
            | ansible.builtin.join(__pve_zfs_newline)
          }}
      vars:
        __pve_zfs_passes_old_raw: "{{ __pve_proxmox_passphrase_item['attributes']['zfs_properties']['passphrase_old'] | ansible.builtin.default('') }}"
        # YAML (not Jinja) escape processing yields the real newline character.
        __pve_zfs_newline: "\n"
      environment:
        __PVE_ZFS_DATASET: "{{ __pve_proxmox_passphrase_item['name'] }}"
        LC_ALL: "C"
      when:
        - pve_proxmox_storage is ansible.builtin.defined
        - pve_proxmox_storage | ansible.builtin.length > 0
        - __pve_zfs_dataset_exists[__pve_proxmox_passphrase_item['name']] | ansible.builtin.default(false) | ansible.builtin.bool
        - __pve_proxmox_passphrase_item['attributes']['zfs_properties']['encryption'] is ansible.builtin.defined
        - __pve_proxmox_passphrase_item['attributes']['zfs_properties']['passphrase'] is ansible.builtin.defined
        - __pve_proxmox_passphrase_item['attributes']['zfs_properties']['passphrase_old'] is ansible.builtin.defined
        - __pve_proxmox_passphrase_item['attributes']['zfs_properties']['passphrase_old'] is not ansible.builtin.none
      changed_when:
        - __pve_zfs_passphrase_change is ansible.builtin.success
        - "'SUCCESS' in __pve_zfs_passphrase_change['stdout']"
      loop: >-
        {{
          pve_proxmox_storage | ansible.builtin.default([], true)
          | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'zfs_dataset')
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__pve_proxmox_passphrase_item"
        label: "{{ __pve_proxmox_passphrase_item['name'] }}"
      register: __pve_zfs_passphrase_change
      no_log: true

    - name: "Storage | ZFS | zfs_dataset | Check if encryption keys are loaded"
      ansible.builtin.command:
        argv:
          - "zfs"
          - "get"
          - "-H"
          - "-o"
          - "value"
          - "keystatus"
          - "{{ __pve_proxmox_keystatus_item['name'] }}"
      when:
        - pve_proxmox_storage is ansible.builtin.defined
        - pve_proxmox_storage | ansible.builtin.length > 0
        - __pve_zfs_dataset_exists[__pve_proxmox_keystatus_item['name']] | ansible.builtin.default(false) | ansible.builtin.bool
        - __pve_proxmox_keystatus_item['attributes']['zfs_properties']['encryption'] is ansible.builtin.defined
        - __pve_proxmox_keystatus_item['attributes']['zfs_properties']['encryption'] != 'off'

      changed_when:
        - false
      check_mode: false
      loop: >-
        {{
          __pve_storage_sanitized
          | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'zfs_dataset')
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__pve_proxmox_keystatus_item"
        index_var: "__pve_zfs_dataset_index"
        label: "{{ __pve_proxmox_keystatus_item['name'] }}"
      register: __pve_zfs_dataset_keystatus

    - name: "Storage | ZFS | zfs_dataset | Validate encryption key status"
      ansible.builtin.assert:
        that:
          - __pve_proxmox_keystatus_verify_item['stdout'] in ['available', 'unavailable']
        fail_msg: "Cannot verify ZFS key availability; refusing to load keys."
        quiet: true
      when:
        - not (__pve_proxmox_keystatus_verify_item['skipped'] | ansible.builtin.default(false))
      loop: "{{ __pve_zfs_dataset_keystatus['results'] }}"
      loop_control:
        loop_var: "__pve_proxmox_keystatus_verify_item"
        label: "{{ __pve_proxmox_keystatus_verify_item['__pve_proxmox_keystatus_item']['name'] }}"

    - name: "Storage | ZFS | zfs_dataset | Load encryption keys for volumes with prompt-based passphrase"
      # The passphrase is passed via stdin on purpose (zfs reads the key from
      # stdin when it is not a TTY): embedded in the command text it would be
      # world-readable in the process list (/proc/<pid>/cmdline) of the host
      # while the command runs.
      ansible.builtin.command:
        argv:
          - "zfs"
          - "load-key"
          - "{{ __pve_proxmox_keyload_prompt_item['__pve_proxmox_keystatus_item']['name'] }}"
        stdin: >-
          {{
            (pve_proxmox_storage
             | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'zfs_dataset')
             | ansible.builtin.list)[__pve_proxmox_keyload_prompt_item['__pve_zfs_dataset_index']]
              ['attributes']['zfs_properties']['passphrase']
          }}
      when:
        - __pve_zfs_dataset_keystatus is ansible.builtin.defined
        - not __pve_proxmox_keyload_prompt_item['skipped'] | ansible.builtin.default(false)
        - __pve_proxmox_keyload_prompt_item['stdout'] | ansible.builtin.default('unavailable') == 'unavailable'
        - >-
          __pve_proxmox_keyload_prompt_item['__pve_proxmox_keystatus_item']['attributes']['zfs_properties']['keylocation']
          | ansible.builtin.default('prompt') == 'prompt'
      changed_when:
        - true
      loop: "{{ __pve_zfs_dataset_keystatus['results'] | ansible.builtin.default([]) }}"
      loop_control:
        loop_var: "__pve_proxmox_keyload_prompt_item"
        label: "{{ __pve_proxmox_keyload_prompt_item['__pve_proxmox_keystatus_item']['name'] }}"
      no_log: true

    - name: "Storage | ZFS | zfs_dataset | Load encryption keys for volumes with non-promt-based keys (like file://)"
      ansible.builtin.command:
        argv:
          - "zfs"
          - "load-key"
          - "{{ __pve_proxmox_keyload_key_item['__pve_proxmox_keystatus_item']['name'] }}"
      when:
        - __pve_zfs_dataset_keystatus is ansible.builtin.defined
        - not __pve_proxmox_keyload_key_item['skipped'] | ansible.builtin.default(false)
        - __pve_proxmox_keyload_key_item['stdout'] | ansible.builtin.default('unavailable') == 'unavailable'
        - __pve_proxmox_keyload_key_item['__pve_proxmox_keystatus_item']['attributes']['zfs_properties']['keylocation'] is ansible.builtin.defined
        - __pve_proxmox_keyload_key_item['__pve_proxmox_keystatus_item']['attributes']['zfs_properties']['keylocation'] != 'prompt'
      changed_when:
        - true

      loop: "{{ __pve_zfs_dataset_keystatus['results'] | ansible.builtin.default([]) }}"
      loop_control:
        loop_var: "__pve_proxmox_keyload_key_item"
        label: "{{ __pve_proxmox_keyload_key_item['__pve_proxmox_keystatus_item']['name'] }}"
    - name: "Storage | ZFS | zfs_dataset | Mount encrypted volumes after key load"
      ansible.builtin.command:
        argv:
          - "zfs"
          - "mount"
          - "{{ __pve_proxmox_keymount_item['__pve_proxmox_keystatus_item']['name'] }}"
      when:
        - __pve_zfs_dataset_keystatus is ansible.builtin.defined
        - not __pve_proxmox_keymount_item['skipped'] | ansible.builtin.default(false)
        - __pve_proxmox_keymount_item['stdout'] | ansible.builtin.default('unavailable') == 'unavailable'
      changed_when:
        - true
      failed_when:
        - false

      loop: "{{ __pve_zfs_dataset_keystatus['results'] | ansible.builtin.default([]) }}"
      loop_control:
        loop_var: "__pve_proxmox_keymount_item"
        label: "{{ __pve_proxmox_keymount_item['__pve_proxmox_keystatus_item']['name'] }}"
    - name: "Storage | ZFS | zfs_dataset | Verify volume creation (by gathering facts)"
      community.general.zfs_facts:
        name: "{{ __pve_proxmox_dataset_verify_item['name'] }}"
        type: "filesystem"
      when:
        - pve_proxmox_storage is ansible.builtin.defined
        - pve_proxmox_storage | ansible.builtin.length > 0

      changed_when:
        - false
      loop: >-
        {{
          __pve_storage_sanitized
          | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'zfs_dataset')
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__pve_proxmox_dataset_verify_item"
    - name: "Storage | ZFS | zfs_dataset | Encryption key notice"
      ansible.builtin.debug:
        msg: |
          Notice:
          zfs_dataset '{{ __pve_proxmox_dataset_notice_item['name'] }}' is encrypted. You will need to load the
          encryption key before the zfs_dataset can be mounted:
            zfs load-key {{ __pve_proxmox_dataset_notice_item['name'] | ansible.builtin.quote }}
            zfs mount {{ __pve_proxmox_dataset_notice_item['name'] | ansible.builtin.quote }}
            zfs get keystatus {{ __pve_proxmox_dataset_notice_item['name'] | ansible.builtin.quote }}

          Hints:
          - Use the -a option instead of the single item names to handle all at once.
          - To ensure the target cannot be accessed without a password during runtime,
            use "zfs unmount" followed by "zfs unload-key".
        verbosity: 0
      when:
        - pve_proxmox_storage is ansible.builtin.defined
        - pve_proxmox_storage | ansible.builtin.length > 0
        - __pve_proxmox_dataset_notice_item['attributes']['zfs_properties']['encryption'] is ansible.builtin.defined
        - __pve_proxmox_dataset_notice_item['attributes']['zfs_properties']['encryption'] != 'off'

      #### NFS Configuration
      loop: >-
        {{
          __pve_storage_sanitized
          | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'zfs_dataset')
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__pve_proxmox_dataset_notice_item"
- name: "Storage | NFS"
  when:
    - pve_proxmox_storage is ansible.builtin.defined
    - pve_proxmox_storage | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'nfs') | ansible.builtin.list | ansible.builtin.length > 0
  block:
    - name: "Storage | NFS | Ensure NFS client packages are installed"
      ansible.builtin.package:
        name:
          - "nfs-common"
        state: "present"

    - name: "Storage | NFS | Validate all NFS configurations"
      ansible.builtin.assert:
        that:
          - __pve_proxmox_nfs_item['attributes']['storage_properties']['src'] is ansible.builtin.defined
          - __pve_proxmox_nfs_item['attributes']['storage_properties']['path'] is ansible.builtin.defined
        fail_msg: |
          NFS mount '{{ __pve_proxmox_nfs_item['name'] }}' is missing required properties.
          Required: 'src' (NFS server and export) and 'path' (local mountpoint)
      when:
        - pve_proxmox_storage is ansible.builtin.defined
        - pve_proxmox_storage | ansible.builtin.length > 0

      loop: >-
        {{
          __pve_storage_sanitized
          | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'nfs')
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__pve_proxmox_nfs_item"
    - name: "Storage | NFS | Ensure mountpoint directories"
      ansible.builtin.file:
        path: "{{ __pve_proxmox_nfs_mountdir_item['attributes']['storage_properties']['path'] }}"
        state: "directory"
        owner: "root"
        group: "root"
        mode: "u=rwx,g=rx,o=rx" # 0755
      when:
        - pve_proxmox_storage is ansible.builtin.defined
        - pve_proxmox_storage | ansible.builtin.length > 0

      loop: >-
        {{
          __pve_storage_sanitized
          | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'nfs')
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__pve_proxmox_nfs_mountdir_item"
    - name: "Storage | NFS | Check if NFS server is reachable"
      ansible.builtin.command:
        argv:
          - "showmount"
          - "-e"
          - "{{ __pve_proxmox_nfs_reach_item['attributes']['storage_properties']['src'] | ansible.builtin.regex_replace(':.*$', '') }}"
      when:
        - pve_proxmox_storage is ansible.builtin.defined
        - pve_proxmox_storage | ansible.builtin.length > 0

      changed_when:
        - false
      failed_when:
        - false
      loop: >-
        {{
          __pve_storage_sanitized
          | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'nfs')
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__pve_proxmox_nfs_reach_item"
      register: __pve_nfs_server_check
    - name: "Storage | NFS | Warn about unreachable NFS servers"
      ansible.builtin.debug:
        msg: |
          WARNING: NFS server {{ __pve_proxmox_nfs_warn_item['__pve_proxmox_nfs_reach_item']['attributes']['storage_properties']['src']
             | ansible.builtin.regex_replace(':.*$', '') }}
          for mount '{{ __pve_proxmox_nfs_warn_item['__pve_proxmox_nfs_reach_item']['name'] }}' is not reachable or does not respond to showmount.

          This may cause the mount task to hang or fail.

          To investigate:
            ping {{ __pve_proxmox_nfs_warn_item['__pve_proxmox_nfs_reach_item']['attributes']['storage_properties']['src']
             | ansible.builtin.regex_replace(':.*$', '') }}
            showmount -e {{ __pve_proxmox_nfs_warn_item['__pve_proxmox_nfs_reach_item']['attributes']['storage_properties']['src']
             | ansible.builtin.regex_replace(':.*$', '') }}
        verbosity: 0
      when:
        - __pve_nfs_server_check is ansible.builtin.defined
        - (__pve_proxmox_nfs_warn_item['rc'] | ansible.builtin.default(0)) != 0

      loop: "{{ __pve_nfs_server_check['results'] | ansible.builtin.default([]) }}"
      # The check task uses "failed_when: false", so every result registers as
      # a success; only the return code tells whether showmount worked.
      loop_control:
        loop_var: "__pve_proxmox_nfs_warn_item"
    - name: "Storage | NFS | Check current mount status"
      ansible.builtin.command:
        argv:
          - "findmnt"
          - "-n"
          - "-o"
          - "SOURCE"
          - "{{ __pve_proxmox_nfs_mount_item['attributes']['storage_properties']['path'] }}"
      when:
        - pve_proxmox_storage is ansible.builtin.defined
        - pve_proxmox_storage | ansible.builtin.length > 0

      changed_when:
        - false
      failed_when:
        - false
      loop: >-
        {{
          __pve_storage_sanitized
          | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'nfs')
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__pve_proxmox_nfs_mount_item"
      register: __pve_nfs_current_mounts
    - name: "Storage | NFS | Build mount status dictionary"
      ansible.builtin.set_fact:
        __pve_nfs_mount_status: >-
          {{
            __pve_nfs_mount_status | ansible.builtin.default({}) | ansible.builtin.combine({
              __pve_proxmox_nfs_status_item['__pve_proxmox_nfs_mount_item']['name']: {
                'is_mounted': (__pve_proxmox_nfs_status_item['rc'] | ansible.builtin.default(1)) == 0,
                'current_source': __pve_proxmox_nfs_status_item['stdout'] | ansible.builtin.default('') | ansible.builtin.trim
              }
            })
          }}
      when:
        - __pve_nfs_current_mounts is ansible.builtin.defined

      loop: "{{ __pve_nfs_current_mounts['results'] | ansible.builtin.default([]) }}"
      loop_control:
        loop_var: "__pve_proxmox_nfs_status_item"
    - name: "Storage | NFS | Mount NFS shares"
      ansible.posix.mount:
        src: "{{ __pve_proxmox_nfs_mount_do_item['attributes']['storage_properties']['src'] }}"
        path: "{{ __pve_proxmox_nfs_mount_do_item['attributes']['storage_properties']['path'] }}"
        fstype: "nfs"
        opts: "{{ __pve_proxmox_nfs_mount_do_item['attributes']['storage_properties']['opts'] | ansible.builtin.default('defaults') }}"
        state: "{{ __pve_proxmox_nfs_mount_do_item['attributes']['storage_properties']['state'] | ansible.builtin.default('mounted') }}"
        backup: false
      when:
        - pve_proxmox_storage is ansible.builtin.defined
        - pve_proxmox_storage | ansible.builtin.length > 0

      loop: >-
        {{
          __pve_storage_sanitized
          | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'nfs')
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__pve_proxmox_nfs_mount_do_item"
    - name: "Storage | NFS | Verify mounts are accessible"
      ansible.builtin.command:
        argv:
          - "mountpoint"
          - "-q"
          - "{{ __pve_proxmox_nfs_verify_item['attributes']['storage_properties']['path'] }}"
      when:
        - pve_proxmox_storage is ansible.builtin.defined
        - pve_proxmox_storage | ansible.builtin.length > 0
        - __pve_proxmox_nfs_verify_item['attributes']['storage_properties']['state'] | ansible.builtin.default('mounted') == 'mounted'

      changed_when:
        - false
      failed_when:
        - false
      loop: >-
        {{
          __pve_storage_sanitized
          | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'nfs')
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__pve_proxmox_nfs_verify_item"
      register: __pve_nfs_mount_verify
    - name: "Storage | NFS | Report mount verification results"
      ansible.builtin.debug:
        msg: |
          {% if (__pve_proxmox_nfs_report_item['rc'] | ansible.builtin.default(1)) == 0 %}
          ✓ NFS mount '{{ __pve_proxmox_nfs_report_item['__pve_proxmox_nfs_verify_item']['name']
             }}' at {{ __pve_proxmox_nfs_report_item['__pve_proxmox_nfs_verify_item']['attributes']['storage_properties']['path']
             }} is a mountpoint; server accessibility was not checked
          {% else %}
          ✗ NFS mount '{{ __pve_proxmox_nfs_report_item['__pve_proxmox_nfs_verify_item']['name']
             }}' at {{ __pve_proxmox_nfs_report_item['__pve_proxmox_nfs_verify_item']['attributes']['storage_properties']['path']
             }} is NOT properly mounted
          {% endif %}
        verbosity: 0
      when:
        - __pve_nfs_mount_verify is ansible.builtin.defined
        - not (__pve_proxmox_nfs_report_item['skipped'] | ansible.builtin.default(false))

      ### Proxmox Storage Manager Configuration
      loop: "{{ __pve_nfs_mount_verify['results'] | ansible.builtin.default([]) }}"
      loop_control:
        loop_var: "__pve_proxmox_nfs_report_item"
- name: "Storage | pvesm"
  when:
    - pve_proxmox_sm is ansible.builtin.defined
    - pve_proxmox_sm | ansible.builtin.length > 0
  block:
    - name: "Storage | pvesm | Ensure storage configuration file exists"
      ansible.builtin.file:
        path: "/etc/pve/storage.cfg"
        state: "touch"
        owner: "root"
        group: "www-data"
        # noqa risky-file-permissions
        access_time: "preserve"

        modification_time: "preserve"
    - name: "Storage | pvesm | Get existing storage configurations"
      ansible.builtin.command:
        # sadly, no "--output-format json"
        argv:
          - "pvesm"
          - "status"
          - "--enabled"
          - "0"
      changed_when:
        - false
      failed_when:
        - false

      register: __pve_storage_status
    - name: "Storage | pvesm | Parse existing storage names"
      ansible.builtin.set_fact:
        __pve_existing_storages: >-
          {{
            __pve_storage_status['stdout_lines']
            | ansible.builtin.select('ansible.builtin.match', '^[a-zA-Z]')
            | ansible.builtin.map('ansible.builtin.regex_replace', '^([^\s]+).*', '\1')
            | ansible.builtin.list
          }}
      when:
        - __pve_storage_status is ansible.builtin.success

    - name: "Storage | pvesm | Validate all storage types are supported"
      ansible.builtin.assert:
        that:
          - __pve_proxmox_sm_item['type'] in ['dir', 'zfspool']
          - >-
            (__pve_proxmox_sm_item['type'] != 'dir')
            or (__pve_proxmox_sm_item['storage_properties']['path'] is ansible.builtin.defined)
          - >-
            (__pve_proxmox_sm_item['type'] != 'zfspool')
            or (__pve_proxmox_sm_item['storage_properties']['pool'] is ansible.builtin.defined)
        fail_msg: |
          Proxmox storage '{{ __pve_proxmox_sm_item['name'] }}' is invalid: the type has to
          be 'dir' (requires 'storage_properties.path') or 'zfspool' (requires
          'storage_properties.pool').
      when:
        - pve_proxmox_sm is ansible.builtin.defined
        - pve_proxmox_sm | ansible.builtin.length > 0

      loop: "{{ pve_proxmox_sm | ansible.builtin.default([], true) }}"
      loop_control:
        loop_var: "__pve_proxmox_sm_item"
    - name: "Storage | pvesm | Directory | Create mountpoint directory"
      ansible.builtin.file:
        path: "{{ __pve_proxmox_sm_item['storage_properties']['path'] }}"
        state: "directory"
        owner: "root"
        group: "root"
        mode: "u=rwx,g=rx,o=rx" # 0755
      when:
        - pve_proxmox_sm is ansible.builtin.defined
        - pve_proxmox_sm | ansible.builtin.length > 0

      loop: >-
        {{
          pve_proxmox_sm | ansible.builtin.default([], true)
          | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'dir')
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__pve_proxmox_sm_item"
    - name: "Storage | pvesm | Check if storage already configured"
      ansible.builtin.set_fact:
        __pve_storage_is_configured: >-
          {{
            __pve_storage_is_configured | ansible.builtin.default({}) | ansible.builtin.combine({
              __pve_proxmox_sm_item['name']: __pve_proxmox_sm_item['name'] in (__pve_existing_storages | ansible.builtin.default([]))
            })
          }}
      when:
        - pve_proxmox_sm is ansible.builtin.defined
        - pve_proxmox_sm | ansible.builtin.length > 0

      loop: "{{ pve_proxmox_sm | ansible.builtin.default([], true) }}"
      loop_control:
        loop_var: "__pve_proxmox_sm_item"
    - name: "Storage | pvesm | Read the storage configuration for identity checks"
      ansible.builtin.slurp:
        src: "/etc/pve/storage.cfg"
      register: __pve_storage_cfg_slurp

    - name: "Storage | pvesm | Parse the existing storage identities"
      ansible.builtin.set_fact:
        __pve_storage_identities: >-
          {%- set __ns = namespace(map={}, current='') -%}
          {%- for __line in (__pve_storage_cfg_slurp['content'] | ansible.builtin.default('') | ansible.builtin.b64decode).splitlines() -%}
          {%-   if __line is ansible.builtin.match('^[a-z]+:') -%}
          {%-     set __ns.current = __line.split(':', 1) | ansible.builtin.last | ansible.builtin.trim -%}
          {%-     set _ = __ns.map.update({__ns.current: {'type': (__line.split(':', 1) | ansible.builtin.first)}}) -%}
          {%-   elif ((__ns.current | ansible.builtin.length) > 0) and (__line is ansible.builtin.match('^\s+(path|pool)\s')) -%}
          {%-     set __kv = __line | ansible.builtin.trim -%}
          {%-     set __key = __kv.split(' ', 1) | ansible.builtin.first -%}
          {%-     set __val = __kv.split(' ', 1) | ansible.builtin.last | ansible.builtin.trim -%}
          {%-     set _ = __ns.map[__ns.current].update({__key: __val}) -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ __ns.map }}


    # An existing storage ID is only "the same storage" when its type and
    # backing (path or pool) match the declaration; reconciling mutable
    # settings onto a different backend would corrupt it. Matching by name
    # alone is not an identity.
    - name: "Storage | pvesm | Check existing storage identities match the declaration"
      ansible.builtin.assert:
        that:
          - (__pve_storage_identities[__pve_proxmox_sm_item['name']]['type'] | ansible.builtin.default('')) == __pve_proxmox_sm_item['type']
          - >-
            (__pve_proxmox_sm_item['type'] != 'dir')
            or ((__pve_storage_identities[__pve_proxmox_sm_item['name']]['path'] | ansible.builtin.default(''))
                == __pve_proxmox_sm_item['storage_properties']['path'])
          - >-
            (__pve_proxmox_sm_item['type'] != 'zfspool')
            or ((__pve_storage_identities[__pve_proxmox_sm_item['name']]['pool'] | ansible.builtin.default(''))
                == __pve_proxmox_sm_item['storage_properties']['pool'])
        fail_msg: |
          The existing Proxmox storage '{{ __pve_proxmox_sm_item['name'] }}'
          ({{ __pve_storage_identities[__pve_proxmox_sm_item['name']] | ansible.builtin.default({}) }})
          does not match the declaration (type '{{ __pve_proxmox_sm_item['type'] }}',
          {{ __pve_proxmox_sm_item['storage_properties'] | ansible.builtin.default({}) }}).
          Refusing to reconcile settings onto a different storage backend;
          rename the declared storage or remove the existing one.
        quiet: true
      when:
        - __pve_storage_is_configured[__pve_proxmox_sm_item['name']] | ansible.builtin.default(false) | ansible.builtin.bool
        - __pve_proxmox_sm_item['name'] in (__pve_storage_identities | ansible.builtin.default({}))

      loop: "{{ pve_proxmox_sm | ansible.builtin.default([], true) }}"
      loop_control:
        loop_var: "__pve_proxmox_sm_item"
    - name: "PVE | Storage | pvesm | Directory | Add directory storage"
      ansible.builtin.command:
        argv: >-
          {{
            ["pvesm", "add", "dir", __pve_proxmox_sm_item['name'],
              "--path", __pve_proxmox_sm_item['storage_properties']['path']]
            + (["--is_mountpoint", "yes"]
              if (__pve_proxmox_sm_item['storage_properties']['is_mountpoint'] | ansible.builtin.default(false) | ansible.builtin.bool) else [])
            + (["--content", (__pve_proxmox_sm_item['storage_properties']['content'] | ansible.builtin.join(','))]
              if __pve_proxmox_sm_item['storage_properties']['content'] is ansible.builtin.defined else [])
            + (["--nodes", (__pve_proxmox_sm_item['storage_properties']['nodes'] | ansible.builtin.join(','))]
              if __pve_proxmox_sm_item['storage_properties']['nodes'] is ansible.builtin.defined else [])
          }}
      when:
        - pve_proxmox_sm is ansible.builtin.defined
        - pve_proxmox_sm | ansible.builtin.length > 0
        - not __pve_storage_is_configured[__pve_proxmox_sm_item['name']] | ansible.builtin.default(false) | ansible.builtin.bool
      changed_when:
        - true

      # FIXME add more options and types from https://pve.proxmox.com/pve-docs/pvesm.1.html
      loop: >-
        {{
          pve_proxmox_sm | ansible.builtin.default([], true)
          | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'dir')
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__pve_proxmox_sm_item"
    - name: "Storage | pvesm | ZFS Pool | Add ZFS pool storage"
      ansible.builtin.command:
        argv: >-
          {{
            ["pvesm", "add", "zfspool", __pve_proxmox_sm_item['name'],
              "--pool", __pve_proxmox_sm_item['storage_properties']['pool']]
            + (["--path", __pve_proxmox_sm_item['storage_properties']['path']]
              if __pve_proxmox_sm_item['storage_properties']['path'] is ansible.builtin.defined else [])
            + (["--is_mountpoint", 'yes']
                if (__pve_proxmox_sm_item['storage_properties']['is_mountpoint'] | ansible.builtin.default(false) | ansible.builtin.bool) else [])
            + (["--content", (__pve_proxmox_sm_item['storage_properties']['content'] | ansible.builtin.join(','))]
                if __pve_proxmox_sm_item['storage_properties']['content'] is ansible.builtin.defined else [])
            + (["--sparse", 'true']
                if (__pve_proxmox_sm_item['storage_properties']['sparse'] | ansible.builtin.default(false) | ansible.builtin.bool) else [])
            + (["--blocksize", __pve_proxmox_sm_item['storage_properties']['blocksize']]
                if __pve_proxmox_sm_item['storage_properties']['blocksize'] is ansible.builtin.defined else [])
            + (["--nodes", (__pve_proxmox_sm_item['storage_properties']['nodes'] | ansible.builtin.join(','))]
              if __pve_proxmox_sm_item['storage_properties']['nodes'] is ansible.builtin.defined else [])
          }}
      when:
        - pve_proxmox_sm is ansible.builtin.defined
        - pve_proxmox_sm | ansible.builtin.length > 0
        - not __pve_storage_is_configured[__pve_proxmox_sm_item['name']] | ansible.builtin.default(false) | ansible.builtin.bool
      changed_when:
        - true

      # "pvesm add" only handles new storage IDs, so property changes on already
      # configured storages (content, nodes, is_mountpoint, sparse, blocksize)
      # would silently never be applied. Creation-time properties (type, path,
      # pool) are immutable in PVE and deliberately not compared.
      loop: >-
        {{
          pve_proxmox_sm | ansible.builtin.default([], true)
          | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'zfspool')
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__pve_proxmox_sm_item"
    - name: "Storage | pvesm | Get the configuration of already configured storages"
      ansible.builtin.command:
        argv:
          - "pvesh"
          - "get"
          - "/storage/{{ __pve_proxmox_sm_item['name'] }}"
          - "--output-format"
          - "json"
      when:
        - __pve_storage_is_configured[__pve_proxmox_sm_item['name']] | ansible.builtin.default(false) | ansible.builtin.bool

      changed_when:
        - false
      loop: "{{ pve_proxmox_sm | ansible.builtin.default([], true) }}"
      loop_control:
        loop_var: "__pve_proxmox_sm_item"
        label: "{{ __pve_proxmox_sm_item['name'] }}"
      register: __pve_storage_current
    - name: "Storage | pvesm | Update properties of already configured storages"
      ansible.builtin.command:
        argv: "{{ ['pvesm', 'set', __pve_sm_item['name']] + __pve_sm_set_args }}"
      vars:
        __pve_sm_item: "{{ __pve_proxmox_sm_update_item['__pve_proxmox_sm_item'] }}"
        __pve_sm_props: "{{ __pve_sm_item['storage_properties'] }}"
        __pve_sm_current: "{{ __pve_proxmox_sm_update_item['stdout'] | ansible.builtin.from_json }}"
        # PVE returns list-ish options as comma-separated strings in arbitrary
        # member order; both sides get normalized to sorted lists.
        __pve_sm_content_desired: "{{ __pve_sm_props['content'] | ansible.builtin.default([]) | ansible.builtin.sort }}"
        __pve_sm_content_current: >-
          {{
            (__pve_sm_current['content'] | ansible.builtin.default('')).split(',')
            | ansible.builtin.select() | ansible.builtin.sort
          }}
        __pve_sm_nodes_desired: "{{ __pve_sm_props['nodes'] | ansible.builtin.default([]) | ansible.builtin.sort }}"
        __pve_sm_nodes_current: >-
          {{
            (__pve_sm_current['nodes'] | ansible.builtin.default('')).split(',')
            | ansible.builtin.select() | ansible.builtin.sort
          }}
        __pve_sm_mp_desired: "{{ __pve_sm_props['is_mountpoint'] | ansible.builtin.default(false) | ansible.builtin.bool }}"
        __pve_sm_mp_current: "{{ __pve_sm_current['is_mountpoint'] | ansible.builtin.default('no') | ansible.builtin.bool }}"
        __pve_sm_sparse_desired: "{{ __pve_sm_props['sparse'] | ansible.builtin.default(false) | ansible.builtin.bool }}"
        __pve_sm_sparse_current: "{{ __pve_sm_current['sparse'] | ansible.builtin.default(0) | ansible.builtin.bool }}"
        __pve_sm_set_args: >-
          {{
            (['--content', (__pve_sm_content_desired | ansible.builtin.join(','))]
             if ((__pve_sm_props['content'] is ansible.builtin.defined)
                 and (__pve_sm_content_desired != __pve_sm_content_current)) else [])
            + (['--nodes', (__pve_sm_nodes_desired | ansible.builtin.join(','))]
               if ((__pve_sm_props['nodes'] is ansible.builtin.defined)
                   and (__pve_sm_nodes_desired != __pve_sm_nodes_current)) else [])
            + (['--is_mountpoint', ('yes' if (__pve_sm_mp_desired | ansible.builtin.bool) else 'no')]
               if ((__pve_sm_item['type'] == 'dir')
                   and ((__pve_sm_mp_desired | ansible.builtin.bool) != (__pve_sm_mp_current | ansible.builtin.bool))) else [])
            + (['--sparse', ('1' if (__pve_sm_sparse_desired | ansible.builtin.bool) else '0')]
               if ((__pve_sm_item['type'] == 'zfspool')
                   and ((__pve_sm_sparse_desired | ansible.builtin.bool) != (__pve_sm_sparse_current | ansible.builtin.bool))) else [])
            + (['--blocksize', __pve_sm_props['blocksize']]
               if ((__pve_sm_props['blocksize'] is ansible.builtin.defined)
                   and (__pve_sm_props['blocksize'] != (__pve_sm_current['blocksize'] | ansible.builtin.default('')))) else [])
          }}
      when:
        - not (__pve_proxmox_sm_update_item['skipped'] | ansible.builtin.default(false))
        - (__pve_sm_set_args | ansible.builtin.length) > 0
      changed_when:
        - true

      loop: "{{ __pve_storage_current['results'] | ansible.builtin.default([]) }}"
      loop_control:
        loop_var: "__pve_proxmox_sm_update_item"
        label: "{{ __pve_proxmox_sm_update_item['__pve_proxmox_sm_item']['name'] | ansible.builtin.default('skipped') }}"
    - name: "Storage | pvesm | Verify storage configuration"
      ansible.builtin.command:
        argv:
          - "pvesh"
          - "get"
          - "/storage/{{ __pve_proxmox_sm_item['name'] }}"
          - "--output-format"
          - "json"
      when:
        - pve_proxmox_sm is ansible.builtin.defined
        - pve_proxmox_sm | ansible.builtin.length > 0
      changed_when:
        - false
      loop: "{{ pve_proxmox_sm | ansible.builtin.default([], true) }}"
      loop_control:
        loop_var: "__pve_proxmox_sm_item"
      register: __pve_storage_verify
