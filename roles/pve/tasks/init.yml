# Initialization: Manage internal role setup and the Ansible environment.

---

- name: "Init | Gather role-specific facts"
  ansible.builtin.setup:
    gather_subset: "{{ __pve_proxmox_used_facts.keys() | ansible.builtin.list }}"
  when:
    - not ((__pve_proxmox_used_facts.values() | ansible.builtin.flatten)
           is ansible.builtin.subset(ansible_facts.keys()))


- name: "Init | Include role meta data"
  ansible.builtin.include_vars:
    file: "../meta/main.yml"
    name: "__pve_proxmox_meta"


- name: "Init | Check Ansible version requirement and fail if unmet"
  ansible.builtin.fail:
    msg: >
      This role requires Ansible {{ __pve_proxmox_meta['galaxy_info']['min_ansible_version'] }}
      or higher. You are currently running Ansible {{ ansible_version['full'] }} .
  when:
    - ansible_version['full'] is ansible.builtin.version(__pve_proxmox_meta['galaxy_info']['min_ansible_version'], '<')


- name: "Init | Notify when platform support check is not possible"
  ansible.builtin.debug:
    msg: >
      The list of supported platforms cannot be checked as it is either empty
      or distribution facts are missing.
    verbosity: 1
  when:
    - ansible_facts['os_family'] is not ansible.builtin.defined or
      ansible_facts['distribution'] is not ansible.builtin.defined or
      ansible_facts['distribution_version'] is not ansible.builtin.defined or
      ansible_facts['distribution_major_version'] is not ansible.builtin.defined or
      ((__pve_proxmox_supported_platforms | ansible.builtin.length) == 0)


- name: "Init | Warn when platform is unsupported"
  ansible.builtin.fail:
    msg: >
      Neither {{ ansible_facts['distribution'] }} (distribution) nor {{ ansible_facts['os_family'] }} (os_family)
      with versions '{{ ansible_facts['distribution_major_version'] }}', '{{ ansible_facts['distribution_version'] }}',
      or 'all' is in the list of supported platforms from vars/main.yml: {{ __pve_proxmox_supported_platforms }}
  vars:
    __pve_proxmox_platform_names_regex: >-
      ^({{ ansible_facts['distribution'] }}|{{ ansible_facts['os_family'] }})$
    __pve_proxmox_platform_versions_regex: >-
      ^({{ ansible_facts['distribution_major_version'] }}|{{ ansible_facts['distribution_version'] }}|all)$
    __pve_proxmox_matched_versions: >-
      {{
        __pve_proxmox_supported_platforms
        | ansible.builtin.selectattr('name', 'ansible.builtin.match', __pve_proxmox_platform_names_regex, ignorecase=true)
        | ansible.builtin.map(attribute='versions')
        | ansible.builtin.flatten
        | ansible.builtin.select('ansible.builtin.match', __pve_proxmox_platform_versions_regex, ignorecase=true)
        | ansible.builtin.list
      }}
  when:
    - (__pve_proxmox_supported_platforms | ansible.builtin.length) > 0
    - (__pve_proxmox_matched_versions | ansible.builtin.length) == 0
  ignore_errors: true # noqa: ignore-errors


- name: "Init | Set platform-specific filename list (most to least specific; raw with possible duplicates)"
  ansible.builtin.set_fact:
    __pve_proxmox_platform_filenames_raw:
      - "{{ __pve_proxmox_dist }}_{{ __pve_proxmox_dist_ver }}.yml"
      - "{{ __pve_proxmox_dist }}_{{ __pve_proxmox_dist_major }}.yml"
      - "{{ __pve_proxmox_dist }}.yml"
      - "{{ __pve_proxmox_os_family }}.yml"
  vars:
    __pve_proxmox_dist: >-
      {{
        ansible_facts['distribution']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __pve_proxmox_dist_ver: >-
      {{
        ansible_facts['distribution_version']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __pve_proxmox_dist_major: >-
      {{
        ansible_facts['distribution_major_version']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __pve_proxmox_os_family: >-
      {{
        ansible_facts['os_family']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}


- name: "Init | Set unique platform-specific filename list (most to least specific)"
  ansible.builtin.set_fact:
    __pve_proxmox_platform_filenames_most_specific_first: >-
      {{
        (__pve_proxmox_platform_filenames_raw
        | ansible.builtin.unique
        | ansible.builtin.default([]))
      }}


- name: "Init | Set unique platform-specific filename list (least to most specific)"
  ansible.builtin.set_fact:
    __pve_proxmox_platform_filenames_most_specific_last: >-
      {{
        __pve_proxmox_platform_filenames_most_specific_first
        | ansible.builtin.reverse
      }}


- name: "Init | Include platform-specific variables (if any), overwrite values with more specific ones"
  ansible.builtin.include_vars:
    file: "{{ __pve_proxmox_vars_file }}"
  vars:
    __pve_proxmox_vars_file: "{{ role_path }}/vars/{{ item }}"
  when:
    - __pve_proxmox_vars_file is ansible.builtin.file
  loop: "{{ __pve_proxmox_platform_filenames_most_specific_last }}"


### PVE specific


- name: "Init | Create temporary directory for file backups (disaster safeguard)"
  ansible.builtin.tempfile:
    state: "directory"
    prefix: "ansible_pve_backup_{{ ansible_date_time['epoch'] }}_"
  register: __pve_tmpdir_backup
  when:
    - pve_proxmox_tmpbackupfiles | ansible.builtin.bool


- name: "Init | Show temporary directory path"
  ansible.builtin.debug:
    msg: "Backup directory (best-effort for emergency config errors, usually kept until next reboot): {{ __pve_tmpdir_backup['path'] }}"
  when:
    - pve_proxmox_tmpbackupfiles | ansible.builtin.bool


### Cluster-wide file coordination

# /etc/pve/datacenter.cfg and /etc/pve/firewall/cluster.fw live on pmxcfs and
# are shared by the whole cluster. When several nodes of one cluster run this
# role in the same play, each of them would rewrite these files and the last
# writer would silently win (nondeterministic policy when host variables
# differ). Therefore one deterministic writer per cluster is selected and the
# cluster-scoped inputs of all its nodes have to be identical.

- name: "Init | Check for a corosync cluster configuration"
  ansible.builtin.stat:
    path: "/etc/pve/corosync.conf"
  register: __pve_corosync_conf_stat


- name: "Init | Read the corosync cluster configuration (clustered setups)"
  ansible.builtin.slurp:
    src: "/etc/pve/corosync.conf"
  register: __pve_corosync_conf_raw
  when:
    - __pve_corosync_conf_stat['stat']['exists']


- name: "Init | Publish the cluster identity and the cluster-scoped inputs"
  # set_fact on purpose: only facts are visible to the other play hosts via
  # hostvars (role parameters and inventory variables resolved locally are
  # not, reliably), and the writer selection plus the equality check below
  # need exactly that visibility.
  ansible.builtin.set_fact:
    # A standalone node forms a "cluster" of its own (and stays its own writer).
    __pve_cluster_name: >-
      {{
        (__pve_corosync_conf_raw['content'] | ansible.builtin.b64decode
         | ansible.builtin.regex_search('cluster_name\s*:\s*(\S+)', '\1')
         | ansible.builtin.first)
        if (__pve_corosync_conf_stat['stat']['exists'])
        else inventory_hostname
      }}
    __pve_cluster_scoped_inputs:
      datacentercfg: "{{ pve_proxmox_datacentercfg }}"
      fw_cluster_options: "{{ pve_proxmox_fw_cluster_options }}"
      fw_cluster_aliases: "{{ pve_proxmox_fw_cluster_aliases }}"
      fw_cluster_ipsets: "{{ pve_proxmox_fw_cluster_ipsets }}"
      fw_cluster_securitygroups: "{{ pve_proxmox_fw_cluster_securitygroups }}"
      fw_cluster_rules: "{{ pve_proxmox_fw_cluster_rules }}"


# Automatic writer selection needs every host of the play to have published
# its cluster identity in the previous task. Only the default linear strategy
# guarantees that: under "serial" each batch sees just itself (and would
# elect one writer per batch, each overwriting the shared policy), under the
# "free" strategy hosts race ahead of the publication. Both cases are
# detected and rejected instead of silently electing a wrong writer;
# configuring pve_proxmox_cluster_writer removes the play-population
# dependency entirely.
- name: "Init | Check the play is compatible with automatic writer selection"
  ansible.builtin.assert:
    that:
      - (ansible_play_hosts | ansible.builtin.sort) == (ansible_play_hosts_all | ansible.builtin.sort)
      - >-
        ansible_play_hosts
        | ansible.builtin.select('ansible.builtin.in', hostvars.keys() | ansible.builtin.list)
        | ansible.builtin.map('ansible.builtin.extract', hostvars, '__pve_cluster_name')
        | ansible.builtin.select('ansible.builtin.defined')
        | ansible.builtin.length == (ansible_play_hosts | ansible.builtin.length)
    fail_msg: >-
      Automatic selection of the cluster-wide file writer is only safe when
      every host of the play runs this task in one linear batch. This play
      uses "serial" batching, the "free" strategy, or hosts dropped out
      before this point. Set 'pve_proxmox_cluster_writer' to the inventory
      hostname of the node that should write the cluster-wide pmxcfs files
      (per cluster, e.g. via group_vars) to run this role in such plays.
    quiet: true
  when:
    - (pve_proxmox_cluster_writer | ansible.builtin.length) == 0


- name: "Init | Select the writer of the cluster-wide files"
  # Sorted for determinism, independent of inventory or --limit ordering. A
  # configured pve_proxmox_cluster_writer wins; it may be absent from the
  # current play (e.g. in another serial batch), in which case no host of
  # this play writes the cluster-wide files.
  ansible.builtin.set_fact:
    __pve_cluster_writer: >-
      {{
        pve_proxmox_cluster_writer
        if ((pve_proxmox_cluster_writer | ansible.builtin.length) > 0)
        else __pve_cluster_writer_auto
      }}
  vars:
    __pve_cluster_writer_auto: >-
      {%- set __pve_members = [] -%}
      {%- for __pve_h in ansible_play_hosts -%}
      {%-   if (hostvars[__pve_h]['__pve_cluster_name'] | ansible.builtin.default('')) == __pve_cluster_name -%}
      {%-     set _ = __pve_members.append(__pve_h) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ (__pve_members | ansible.builtin.sort | ansible.builtin.first) if ((__pve_members | ansible.builtin.length) > 0) else inventory_hostname }}


- name: "Init | Verify the configured writer is a known inventory host"
  ansible.builtin.assert:
    that:
      - pve_proxmox_cluster_writer in hostvars
    fail_msg: >-
      'pve_proxmox_cluster_writer' ({{ pve_proxmox_cluster_writer }}) is not
      an inventory hostname known to this play.
    quiet: true
  when:
    - (pve_proxmox_cluster_writer | ansible.builtin.length) > 0


- name: "Init | Verify the configured writer belongs to this cluster (when its identity is visible)"
  ansible.builtin.assert:
    that:
      - hostvars[__pve_cluster_writer]['__pve_cluster_name'] == __pve_cluster_name
    fail_msg: >-
      'pve_proxmox_cluster_writer' ({{ __pve_cluster_writer }}) belongs to
      cluster "{{ hostvars[__pve_cluster_writer]['__pve_cluster_name'] }}",
      but {{ inventory_hostname }} is a member of cluster
      "{{ __pve_cluster_name }}". Configure the writer per cluster (e.g. via
      group_vars).
    quiet: true
  when:
    - (pve_proxmox_cluster_writer | ansible.builtin.length) > 0
    - __pve_cluster_writer in hostvars
    - hostvars[__pve_cluster_writer]['__pve_cluster_name'] is ansible.builtin.defined


- name: "Init | Verify the cluster-scoped inputs are identical on all nodes of the cluster"
  ansible.builtin.assert:
    that:
      - __pve_cluster_scoped_inputs == hostvars[__pve_cluster_writer]['__pve_cluster_scoped_inputs']
    fail_msg: >-
      The cluster-scoped inputs (pve_proxmox_datacentercfg, pve_proxmox_fw_cluster_*)
      of {{ inventory_hostname }} differ from those of {{ __pve_cluster_writer }},
      the node that writes the cluster-wide pmxcfs files (/etc/pve/datacenter.cfg,
      /etc/pve/firewall/cluster.fw) of cluster "{{ __pve_cluster_name }}".
      Cluster-wide settings have to be identical on every node, e.g. via group_vars.
    success_msg: >-
      Cluster-scoped inputs are consistent, {{ __pve_cluster_writer }} writes the
      cluster-wide files of cluster "{{ __pve_cluster_name }}".
  when:
    - inventory_hostname != __pve_cluster_writer
    # With a configured writer from another serial batch its inputs may not
    # be visible (yet); the check then runs on the batch containing it.
    - __pve_cluster_writer in hostvars
    - hostvars[__pve_cluster_writer]['__pve_cluster_scoped_inputs'] is ansible.builtin.defined
