# Network: Manage interface configuration of Proxmox Virtual Environment (PVE)

---

# Instead of renaming kernel network devices, one can assign alternative names
# (altnames). This preserves the original device name and avoids potential
# kernel/udev conflicts. More information:
# - https://www.freedesktop.org/software/systemd/man/latest/systemd.link.html
# - https://manpages.debian.org/trixie/udev/systemd.link.5.en.html
# - https://pve.proxmox.com/wiki/Network_Configuration#_manual_method
- name: "Network | Create systemd link files: altnames for used interfaces / NICs"
  ansible.builtin.template:
    src: "network/systemd_iface_altnames.link.j2"
    dest: "/etc/systemd/network/10-{{ item['altnames'][0] }}.link"
    owner: "root"
    group: "root"
    mode: "u=rw,g=r,o=r" # 0644
  vars:
    # Pass (and/or adjust) Ansible inventory group_vars / host_vars
    tpl_iface_item:
      type: "{{ item['type'] | ansible.builtin.default('', true) }}"
      mac_address: "{{ item['mac_address'] | ansible.builtin.default('', true) }}"
      desc: "{{ item['desc'] | ansible.builtin.default('', true) }}"
      altnames: "{{ item['altnames'] | ansible.builtin.default([], true) }}"
  # Checked per loop item on purpose: a defective first entry must not skip
  # the remaining (valid) entries.
  when:
    - item['altnames'] is ansible.builtin.defined
    - (item['altnames'] | ansible.builtin.length) > 0
  loop: "{{ pve_proxmox_net_altnames | ansible.builtin.default([], true) }}"
  notify:
    - "pve_proxmox: restart network"


# Only rendered when at least one dataset defines something: with the
# default-empty datasets, replacing a working network configuration with an
# effectively empty file (followed by a network restart) would lock the host
# out.
- name: "Network | Render /etc/network/interfaces.d/10-host"
  ansible.builtin.template:
    src: "network/interfaces.j2"
    dest: "/etc/network/interfaces.d/10-host"
    owner: "root"
    group: "root"
    mode: "u=rw,g=r,o=r" # 0644
  vars:
    tpl_interface_datasets:
      # Pass (and/or adjust) Ansible inventory group_vars / host_vars
      - "{{ pve_proxmox_net_ifaces_host_specific }}"
      - "{{ pve_proxmox_net_ifaces_host_shared }}"
  when: >-
    ((pve_proxmox_net_ifaces_host_specific | ansible.builtin.default({}, true) | ansible.builtin.length) > 0)
    or ((pve_proxmox_net_ifaces_host_shared | ansible.builtin.default({}, true) | ansible.builtin.length) > 0)
  notify:
    - "pve_proxmox: restart network"


- name: "Network | Ensure /etc/network/interfaces exists"
  ansible.builtin.file:
    path: "/etc/network/interfaces"
    state: "touch"
    owner: "root"
    group: "root"
    mode: "u=rw,g=r,o=r" # 0644
    modification_time: "preserve"
    access_time: "preserve"
  notify:
    - "pve_proxmox: restart network"


- name: "Network | Backup existing /etc/network/interfaces (best effort)"
  ansible.builtin.copy:
    src: "/etc/network/interfaces"
    dest: "{{ __pve_tmpdir_backup['path'] }}/interfaces"
    remote_src: true
    owner: "root"
    group: "root"
    mode: "u=rw,g=r,o=" # 0640
  when:
    - pve_proxmox_tmpbackupfiles
  failed_when:
    - false
  changed_when:
    - false


# Only rendered when at least one dataset defines something, see the 10-host
# comment above (an empty /etc/network/interfaces would lock the host out).
- name: "Network | Render /etc/network/interfaces"
  ansible.builtin.template:
    src: "network/interfaces.j2"
    dest: "/etc/network/interfaces"
    owner: "root"
    group: "root"
    mode: "u=rw,g=r,o=r" # 0644
  vars:
    # Pass (and/or adjust) Ansible inventory group_vars / host_vars
    tpl_interface_datasets:
      - "{{ pve_proxmox_net_ifaces_workload_shared }}"
      - "{{ pve_proxmox_net_ifaces_workload_specific }}"
  when: >-
    ((pve_proxmox_net_ifaces_workload_shared | ansible.builtin.default({}, true) | ansible.builtin.length) > 0)
    or ((pve_proxmox_net_ifaces_workload_specific | ansible.builtin.default({}, true) | ansible.builtin.length) > 0)
  notify:
    - "pve_proxmox: restart network"
