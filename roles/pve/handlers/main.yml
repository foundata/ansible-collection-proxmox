---
- name: "Handlers | Update grub"
  ansible.builtin.command:
    argv:
      - "update-grub"
  changed_when:
    - __pve_grub_update is ansible.builtin.success
    - __pve_grub_update['stdout'] is ansible.builtin.search('(?i)Generating')
  register: __pve_grub_update
  listen:
    - "pve_proxmox_update_grub"
    # Migration alias; remove in 2.0.0.
    - "pve_proxmox: update grub"

# "reloaded" on purpose: ifupdown2's networking service reload runs
# "ifreload -a", which only applies configuration deltas and leaves unchanged
# interfaces untouched. A restart (stop + start) would take every interface
# down and up again, briefly disconnecting the host.
- name: "Handlers | Reload network configuration"
  ansible.builtin.service:
    name: "{{ network_service_name | ansible.builtin.default('networking') }}"
    state: "reloaded"
  listen:
    - "pve_proxmox_reload_network"
    # Migration alias; remove in 2.0.0.
    - "pve_proxmox: reload network"
- name: "Handlers | Restart PVE firewall (nftables)"
  ansible.builtin.service:
    name: "proxmox-firewall"
    state: "restarted"
  listen:
    - "pve_proxmox_restart_firewall"
    # Migration alias; remove in 2.0.0.
    - "pve_proxmox: restart pve-firewall"
    # Migration alias; remove in 2.0.0.
    - "pve_proxmox: reload pve-firewall" # Migration alias; remove in 2.0.0. Reload is unavailable for proxmox-firewall.service.
