# Execute the collection role "pve" against all driver-created instances.


- name: "Molecule | Converge | pve | Gather network facts (to determine the NIC enslaved by vmbr0)"
  ansible.builtin.setup:
    gather_subset:
      - "network"


- name: "Molecule | Converge | pve | Determine the uplink NIC of the golden image's vmbr0 bridge"
  ansible.builtin.set_fact:
    __testing_pve_uplink_iface: "{{ ansible_facts['vmbr0']['interfaces'] | ansible.builtin.first }}"


# A real NFS export served by the VM itself, so the role's nfs storage type
# can be exercised without external infrastructure.
- name: "Molecule | Converge | pve | Install the NFS server for the loopback export"
  ansible.builtin.package:
    name:
      - "nfs-kernel-server"
    state: "present"


- name: "Molecule | Converge | pve | Create the NFS export directory"
  ansible.builtin.file:
    path: "/srv/molecule-nfs-export"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "u=rwx,g=rx,o=rx" # 0755


- name: "Molecule | Converge | pve | Export the directory via NFS"
  ansible.builtin.lineinfile:
    path: "/etc/exports"
    line: "/srv/molecule-nfs-export 127.0.0.1(rw,sync,no_subtree_check,no_root_squash)"
    create: true
    owner: "root"
    group: "root"
    mode: "u=rw,g=r,o=r" # 0644


# exportfs -ra is idempotent; unconditional re-export keeps this test
# scaffolding simple (it is not part of the system under test)
- name: "Molecule | Converge | pve | Apply the NFS exports"
  ansible.builtin.command:
    argv: ["exportfs", "-ra"]
  changed_when:
    - false


- name: "Molecule | Converge | pve | Store pve_proxmox_* role parameters in __testing_state"
  ansible.builtin.include_tasks:
    file: "../tasks/state_update.yml"
  vars:
    __testing_state_update:
      # Persisted for the verify stage (runs as a separate play without the
      # converge facts).
      __testing_pve_uplink_iface: "{{ __testing_pve_uplink_iface }}"
      # The role's tasks/main.yml gates every section on this variable but the
      # role does not define a default for it (yet), so the scenario has to
      # provide it explicitly.
      pve_proxmox_state: "present"
      # ansible.builtin.tempfile reports "changed" on every run, so the
      # disaster-safeguard backups would break the idempotence stage. A string
      # on purpose (as delivered by command line extra-vars): the role has to
      # coerce boolean arguments, a truthiness evaluation would treat "false"
      # as enabled (and fail exactly this idempotence guard).
      pve_proxmox_tmpbackupfiles: "false"
      # Reproduce the golden image networking (vmbr0 bridging the single NIC
      # via DHCP): the role authoritatively rewrites /etc/network/interfaces
      # and notifies a network reload, and only a functionally identical
      # configuration keeps ifupdown2 from bouncing the bridge and cutting the
      # Molecule SSH connection.
      pve_proxmox_net_ifaces_workload_shared:
        sections:
          - title: "Proxmox VE (PVE) management bridge (Molecule)"
            interfaces:
              - name: "lo"
                method: "loopback"
              - name: "{{ __testing_pve_uplink_iface }}"
                method: "manual"
                # like the golden image; also checks "auto: false" is honored
                auto: false
              - name: "vmbr0"
                method: "dhcp"
                iface_properties:
                  bridge-ports: "{{ __testing_pve_uplink_iface }}"
                  bridge-stp: "off"
                  bridge-fd: 0
        options_after: |
          source /etc/network/interfaces.d/*
      # The host datasets stay at their empty defaults on the single-NIC test
      # VM: /etc/network/interfaces.d/10-host must NOT be created then (the
      # verify stage checks this).
      # Altnames for MAC addresses no Molecule NIC uses (libvirt assigns
      # 52:54:00:*): renders the systemd link files without affecting the
      # instance's networking. Two entries so per-entry processing is covered.
      pve_proxmox_net_altnames:
        - type: "en"
          desc: "Molecule test NIC 1"
          mac_address: "0e:54:00:aa:bb:01"
          altnames:
            - "molecule1"
        - type: "en"
          desc: "Molecule test NIC 2"
          mac_address: "0e:54:00:aa:bb:02"
          altnames:
            - "molecule2"
      # Keep the firewall disabled (enable: 0): activating it on the throwaway
      # single-node instance could cut the SSH port forward. Rendering,
      # validation and the service reload are still exercised.
      pve_proxmox_fw_cluster_options:
        enable: 0
      pve_proxmox_fw_cluster_aliases:
        - name: "molecule-mgmt"
          ip: "203.0.113.10"
          comment: "Molecule test alias"
      pve_proxmox_fw_cluster_ipsets:
        - name: "molecule_trusted"
          comment: "Molecule test IP set"
          entries:
            - ip: "dc/molecule-mgmt"
            - ip: "198.51.100.0/24"
              comment: "Documentation range"
      pve_proxmox_fw_cluster_securitygroups:
        - name: "molecule_mgmt_in"
          comment: "Molecule test security group"
          rules:
            - direction: "IN"
              action: "SSH(ACCEPT)"
              source: "+dc/molecule_trusted"
              comment: "SSH from trusted networks"
      pve_proxmox_fw_cluster_rules:
        - action: "GROUP"
          security_group: "molecule_mgmt_in"
        - direction: "IN"
          action: "ACCEPT"
          proto: "tcp"
          dport: "8006"
          source: "+dc/molecule_trusted"
          comment: "PVE web UI"
      pve_proxmox_fw_node_options:
        enable: 0
      pve_proxmox_fw_node_rules:
        - direction: "IN"
          action: "Ping(ACCEPT)"
          comment: "Molecule ICMP"
      pve_proxmox_datacentercfg:
        keyboard: "en-us"
        console: "html5"
        # Nested dict on purpose: exercises the key=value,key2=value2 rendering.
        next-id:
          lower: 100
          upper: 999999
      # ZFS mirror on the two blank disks the platform provides for storage
      # tests (see extra_disks in molecule.yml), registered with the PVE
      # storage manager together with a directory storage.
      pve_proxmox_storage:
        - name: "moleculepool"
          type: "zpool"
          attributes:
            mountpoint: "/moleculepool"
            vdevs:
              - type: "mirror"
                disks:
                  - "/dev/disk/by-id/virtio-molecule0"
                  - "/dev/disk/by-id/virtio-molecule1"
            pool_properties:
              ashift: "12"
        # Encrypted dataset with a prompt-based passphrase: covers the
        # keylocation "prompt" creation and key loading paths (the passphrase
        # must reach zfs via stdin, never via the command text). The verify
        # stage rotates the passphrase afterwards.
        - name: "moleculepool/secure"
          type: "zfs_dataset"
          attributes:
            zfs_properties:
              mountpoint: "/moleculepool/secure"
              compression: "on"
              encryption: "aes-256-gcm"
              keyformat: "passphrase"
              keylocation: "prompt"
              passphrase: "molecule-test-passphrase-1"
        # Mixed declaration on purpose: ZFS and NFS items in ONE list
        # (regression: a type check inside the ZFS section rejected every
        # nfs item as soon as any ZFS item existed). The export is served by
        # the VM itself (see the NFS server setup above the role include).
        - name: "molecule-nfs1"
          type: "nfs"
          attributes:
            storage_properties:
              src: "127.0.0.1:/srv/molecule-nfs-export"
              path: "/mnt/molecule-nfs"
      pve_proxmox_sm:
        - name: "molecule-guest1"
          type: "zfspool"
          storage_properties:
            pool: "moleculepool"
            content:
              - "images"
              - "rootdir"
            sparse: true
        - name: "molecule-assets1"
          type: "dir"
          storage_properties:
            path: "/var/lib/molecule-assets"
            content:
              - "iso"
              - "vztmpl"


- name: "Molecule | Converge | pve | Set pve_proxmox_* parameters as facts from __testing_state"
  ansible.builtin.set_fact:
    "{{ item['key'] }}": "{{ item['value'] }}"
  loop: >-
    {{
      (__testing_state | ansible.builtin.default({}, true))
      | ansible.builtin.dict2items
      | ansible.builtin.selectattr('key', 'ansible.builtin.match', '^pve_proxmox_')
      | ansible.builtin.list
    }}
  loop_control:
    # keys only: the values contain the ZFS test passphrases, which must not
    # land in the log (grepping the molecule log for them must stay clean)
    label: "{{ item['key'] }}"


- name: "Molecule | Converge | pve | Include the foundata.proxmox.pve role"
  ansible.builtin.include_role:
    name: "foundata.proxmox.pve"
  # vars: All pve_proxmox_* variables are set as facts and passed this way to
  #       the role, so they can be persisted in __testing_state and restored in
  #       later stages (e.g. verify) without duplicating data across playbooks.
